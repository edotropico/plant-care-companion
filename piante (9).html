e=>e.fBlu},{id:"peperomia",ic:"germoglio",g:"piante",t:"Parente del pepe",d:"Una foglia nuova su una peperomia",m:1,v:e=>e.fPeperomia},{id:"pothos",ic:"foglia",g:"piante",t:"Da Moorea",d:"Cinque foglie nuove su un pothos",m:5,v:e=>e.fPothos},{id:"nomeio",ic:"spunta",t:"Presentazioni",d:"Hai messo il tuo nome nel profilo",m:1,v:e=>e.haNome},{id:"fotoio",ic:"scintilla",t:"Con la tua faccia",d:"Hai messo una foto nel profilo",m:1,v:e=>e.haFoto},{id:"libretto",ic:"disco",t:"Parto tranquillo",d:"Hai generato il libretto per chi annaffia",m:1,v:e=>e.libFatto},{id:"diagnosi",ic:"bussola",t:"Dottore",d:"Hai usato la diagnosi guidata",m:1,v:e=>e.diagFatta},{id:"cercato",ic:"bussola",t:"Cercatore",d:"Hai usato la ricerca",m:1,v:e=>e.ricFatta},{id:"griglia",ic:"griglia",t:"Vista d'insieme",d:"Hai provato la modalit\xE0 griglia",m:1,v:e=>e.grigliaProvata},{id:"quattrostagioni",ic:"luna",t:"Quattro stagioni",d:"Hai usato tutte e quattro le fasi dell'anno",m:4,v:e=>e.stagioniProvate},{id:"archiviata",ic:"disco",t:"Se ne \xE8 andata",d:"Hai archiviato una pianta invece di cancellarla",m:1,v:e=>e.archiviate},{id:"archiviate5",ic:"disco",t:"Memoria lunga",d:"Cinque piante nell'archivio",m:5,v:e=>e.archiviate},{id:"gigante",ic:"serra",segreto:!0,t:"Fuori scala",d:"Una pianta arrivata in cima al proprio sostegno",m:1,v:e=>e.inCima},{id:"neemfinito",ic:"insetto",segreto:!0,t:"Battaglia vinta",d:"Un ciclo di neem portato a termine per intero",m:1,v:e=>e.neemCompletati},{id:"neemtre",ic:"insetto",segreto:!0,t:"Tre battaglie",d:"Tre cicli di neem completati",m:3,v:e=>e.neemCompletati},{id:"rinascita",ic:"cuore",segreto:!0,t:"Rinascita",d:"Una foglia nuova su una pianta segnata come sofferente",m:1,v:e=>e.fogliaInCura},{id:"dieciazioni",ic:"stella",segreto:!0,t:"Giornata campale",d:"Dieci registrazioni in un solo giorno",m:1,v:e=>e.maxGiornoTotale>=10?1:0},{id:"mesepieno",ic:"calendario",segreto:!0,t:"Mese pieno",d:"Almeno una registrazione in venti giorni diversi dello stesso mese",m:1,v:e=>e.meseFitto},{id:"settimane",ic:"spunta",segreto:!0,t:"Otto settimane",d:"Otto settimane di fila con almeno una cura",m:8,v:e=>e.settimaneFila},{id:"nessunritardo20",ic:"spunta",segreto:!0,t:"Venti pronte",d:"Venti piante e nemmeno una in ritardo",m:1,v:e=>e.piante>=20&&e.inRitardo===0?1:0},{id:"tuttenote",ic:"etichetta",segreto:!0,t:"Ognuna la sua storia",d:"Ogni pianta ha una nota scritta",m:1,v:e=>e.piante>0&&e.senzaNota===0?1:0},{id:"tuttasalute",ic:"cuore",segreto:!0,t:"Tutte in forma",d:"Ogni pianta segnata come in forma",m:1,v:e=>e.piante>0&&e.forti===e.piante?1:0},{id:"veterana",ic:"calendario",segreto:!0,t:"La pi\xF9 fedele",d:"Una pianta con te da pi\xF9 di tre anni",m:1,v:e=>e.piuVecchia},{id:"sedici",ic:"vasi",segreto:!0,t:"Sedici in una stanza",d:"Sedici piante nella stessa stanza",m:16,v:e=>e.maxPerStanza},{id:"acquapura",ic:"goccia",segreto:!0,t:"Solo acqua buona",d:"Otto piante che ricevono acqua demineralizzata o riposata",m:8,v:e=>e.acquaDelicata},{id:"notturno",ic:"luna",segreto:!0,t:"Le due stagioni estreme",d:"Aver usato sia la piena estate che il pieno riposo",m:2,v:e=>e.estremi},{id:"collezionetotale",ic:"corona",segreto:!0,t:"Il grande giardino",d:"Cinquanta piante seguite insieme",m:50,v:e=>e.piante},{id:"curioso",ic:"bussola",t:"Esploratore",segreto:!0,d:"Aver visitato Storico, Terricci e il profilo",m:3,v:e=>e.esplorate}],Ev=["Il mese pi\xF9 buio dell'anno: acqua ridotta al minimo, niente concime, e occhio all'aria secca dei termosifoni.","La luce comincia a tornare ma le piante dormono ancora. Buon momento per procurarti corteccia, perlite e vasi in vista di marzo.","Riparte tutto: \xE8 il mese dei rinvasi e del ritorno al concime, meglio a met\xE0 dose per le prime due volte. Rimetti la stagione su crescita.","Crescita piena. Le prime foglie nuove arrivano adesso: segnale che gli intervalli invernali vanno accorciati.","Il mese di massimo vigore, il migliore per talee e propagazioni. Tutto quello che tagli adesso radica in fretta.","Col caldo i consumi d'acqua salgono. Attenzione al sole diretto attraverso i vetri, che scotta le foglie in poche ore.","Mese critico: caldo secco e ragnetto rosso. Controlla il rovescio delle foglie pi\xF9 spesso del solito.","Se parti, raggruppa le assetate in bagno e lascia stare le grasse. Al rientro, controllo parassiti su tutto.","Ultimo concime pieno dell'anno e ultima finestra utile per un rinvaso leggero: dopo, le radici non fanno in tempo a riprendersi.","Si rallenta: passa la stagione a riposo. I termosifoni che si accendono asciugano l'aria di colpo, pi\xF9 del terriccio.","Poca luce e crescita quasi ferma. Riduci l'acqua e sospendi del tutto il concime.","Minimo assoluto. Non rinvasare, non potare, non concimare: qualsiasi stress ora non viene recuperato."],ef={morta:"Non ce l'ha fatta",regalata:"Regalata",ceduta:"Data via",altro:"Altro"};function Ni(e="breve"){try{if(navigator.vibrate){navigator.vibrate(e==="forte"?[12,30,18]:10);return}let t=document.getElementById("scatto-tattile");t&&(t.checked=!t.checked,t.dispatchEvent(new Event("change")))}catch{}}var Av=[{id:"rubinetto",t:"Rubinetto",costo:"gratis",come:"Direttamente dal lavandino.",risolve:"Va benissimo per la maggior parte delle piante d'appartamento.",problema:"Se la tua zona ha acqua dura, lascia depositi di calcare e con gli anni alza il pH del terriccio.",per:["Stefani","la Delizia","la Gaga","Anastasia","Polly","Polka","rugiada","la reggiana","Medusa","Immobile","la madonna"]},{id:"riposata",t:"Riposata una notte",costo:"gratis",come:"Riempi una brocca aperta e lasciala fuori 12-24 ore prima di usarla.",risolve:"Il cloro evapora e l'acqua arriva a temperatura ambiente, il che evita lo shock alle radici.",problema:"Non toglie il calcare: quello resta tutto. E se il tuo acquedotto usa cloramine al posto del cloro, non evaporano nemmeno quelle.",per:["la Salvata","Memoriale","Eevee","Testarda"]},{id:"demi",t:"Demineralizzata",costo:"circa 1 \u20AC per 5 litri",come:"Al supermercato, nel reparto ferri da stiro. Cerca la tacca che dice solo \u201Cacqua demineralizzata\u201D, senza profumi n\xE9 additivi: quelle profumate rovinano le radici.",risolve:"Zero calcare e zero sali. \xC8 la soluzione pi\xF9 semplice ed economica che esista.",problema:"Essendo priva di minerali, a lungo andare la pianta dipende solo dal concime: non saltarlo.",per:["Sua Maest\xE0","la Vellutata","Kinder Sorpresa","la Religiosa","lumaca","Drama queen","Aracne"]},{id:"piovana",t:"Piovana",costo:"gratis",come:"Un secchio sul balcone quando piove. Scarta i primi minuti di pioggia, che lavano via lo sporco dall'aria, e tienila al buio: alla luce diventa verde di alghe in una settimana.",risolve:"\xC8 l'acqua migliore in assoluto: leggermente acida, senza calcare, con qualche minerale utile.",problema:"Non \xE8 raccoglibile tutto l'anno, e non usarla se scende da una grondaia trattata o da un tetto in bitume.",per:["tutte, quando ne hai"]},{id:"condensa",t:"Condensa del deumidificatore",costo:"gratis",come:"\xC8 l'acqua nella tanica del deumidificatore o dello split del condizionatore.",risolve:"\xC8 praticamente distillata: zero calcare. Il modo pi\xF9 economico di avere acqua pura senza comprarla.",problema:"Solo se l'apparecchio \xE8 pulito: nei filtri sporchi si accumulano batteri. Mai usarla su piante che poi mangi.",per:["stesse della demineralizzata"]},{id:"osmosi",t:"Osmosi inversa",costo:"150-400 \u20AC l'impianto",come:"Un filtro sotto il lavello che spinge l'acqua attraverso una membrana finissima e trattiene quasi tutto. Alcuni frigoriferi e caraffe avanzate ce l'hanno gi\xE0.",risolve:"Acqua pura come la distillata, ma dal rubinetto e senza comprare bottiglie.",problema:"Costa, va installata, e per ogni litro buono ne scarta due o tre. Ha senso solo se la usi anche per bere.",per:["stesse della demineralizzata"]},{id:"caraffa",t:"Caraffa filtrante",costo:"30 \u20AC pi\xF9 i filtri",come:"Le classiche caraffe da frigorifero.",risolve:"Abbassa un po' la durezza e toglie il cloro.",problema:"Non demineralizza: riduce il calcare solo in parte, e la capacit\xE0 cala man mano che il filtro si esaurisce. Meglio di niente, lontana dalla demineralizzata.",per:["una via di mezzo, se non vuoi comprare bottiglie"]},{id:"bollita",t:"Bollita",costo:"gratis",come:"Si fa bollire e si lascia raffreddare, usando solo la parte superiore.",risolve:"Fa precipitare sul fondo una parte del calcare, quello dei carbonati.",problema:"Gli altri sali restano e anzi si concentrano, perch\xE9 parte dell'acqua evapora. \xC8 il rimedio che sembra intelligente e funziona meno di tutti.",per:["nessuna, in pratica"]}],ii={ripresa:{t:"Ripresa",mesi:"marzo-maggio",acqua:1,concime:1,dose:"mezza dose le prime due volte",nota:"Riparte tutto: \xE8 la finestra giusta per i rinvasi e per ricominciare a concimare, ma piano."},piena:{t:"Piena",mesi:"giugno-agosto",acqua:.85,concime:.85,dose:"dose piena",nota:"Massimo vigore e consumi d'acqua pi\xF9 alti: gli intervalli si accorciano da soli."},rallenta:{t:"Rallentamento",mesi:"settembre-novembre",acqua:1.3,concime:1.6,dose:"ultima concimazione a settembre",nota:"La luce cala e la crescita frena. Si allunga fra un'annaffiatura e l'altra e si chiude col concime."},riposo:{t:"Riposo",mesi:"dicembre-febbraio",acqua:1.75,concime:0,dose:"niente concime",nota:"Le piante dormono. Acqua molto ridotta, concime sospeso e nessun intervento traumatico."}},Lv=["ripresa","piena","rallenta","riposo"],sa=e=>e>=2&&e<=4?"ripresa":e>=5&&e<=7?"piena":e>=8&&e<=10?"rallenta":"riposo",ln={nessuno:{t:"Nessuno",nota:""},"palo-cocco":{t:"Palo di cocco",nota:"Bagnalo a ogni annaffiatura: le radici aeree ci si aggrappano solo se \xE8 umido, ed \xE8 questo che fa crescere le foglie pi\xF9 grandi."},tutore:{t:"Tutore singolo",nota:"Legature morbide e larghe: un filo stretto strozza il fusto man mano che ingrossa."},traliccio:{t:"Traliccio o arco",nota:"Guida i getti man mano, non tutti insieme: i tralci maturi si spezzano se piegati di colpo."},pensile:{t:"Vaso pensile",nota:"Ricade invece di salire: taglia le punte ogni tanto o si spoglia alla base."}},Pv={Stefani:"palo-cocco","la Delizia":"palo-cocco","la Gaga":"palo-cocco",Anastasia:"nessuno",Eevee:"traliccio","la Salvata":"pensile"},Is={troppa:{t:"Troppa acqua",ic:"annega"},poca:{t:"Poca acqua",ic:"assetata"},bestie:{t:"Parassiti",ic:"insetto"},funghi:{t:"Funghi",ic:"fungo"},concime:{t:"Concime",ic:"sale"},aria:{t:"Umidit\xE0",ic:"vapore"},luce:{t:"Luce",ic:"sole"}},ca=[{id:"marciume-radici",cat:"troppa",s:"Foglie gialle e terriccio ancora bagnato",c:"Marciume radicale: le radici affogate non assorbono pi\xF9, quindi la pianta ingiallisce come se avesse sete. \xC8 l'inganno pi\xF9 comune, e chi annaffia di pi\xF9 la finisce.",f:["Sfila il pane di terra e guarda: radici bianche o sode stanno bene, brune e molli sono marce.","Taglia tutto il marcio con forbici pulite, rinvasa in substrato asciutto e pi\xF9 drenante.","Non annaffiare per una settimana e non concimare per un mese."],r:["Immobile","la madonna","la Gaga"]},{id:"marciume-colletto",cat:"troppa",s:"Base del fusto molle, scura, che cede al tocco",c:"Marciume del colletto: parte dal punto dove il fusto entra nel terriccio, spesso perch\xE9 l'acqua ristagna l\xEC o \xE8 finita nel cuore della rosetta.",f:["Sulle sansevierie e sulle grasse \xE8 quasi sempre fatale sotto quel punto: taglia sopra il marcio e fai radicare la parte sana.","Annaffia dal basso o lungo il bordo del vaso, mai al centro."],r:["la reggiana","Medusa","le Sorelle"]},{id:"substrato-bagnato",cat:"troppa",s:"Il terriccio resta bagnato per pi\xF9 di una settimana",c:"Substrato compattato o vaso troppo grande: la terra dove non arrivano radici trattiene acqua e basta.",f:["Rinvasa in un vaso solo 2-4 cm pi\xF9 largo, con pi\xF9 perlite o corteccia.","Verifica che il foro di drenaggio non sia otturato dalle radici."],r:["la Vellutata","Immobile"]},{id:"sete",cat:"poca",s:"Foglie afflosciate di colpo, terriccio asciutto",c:"Solo sete. Alcune specie crollano in modo teatrale e si rialzano in un'ora.",f:["Annaffia bene e aspetta: se si rialza era quello.","Se lo fa spesso, accorcia l'intervallo: ogni crollo costa qualche radichetta."],r:["Memoriale","Drama queen","Polka"]},{id:"idrorepellente",cat:"poca",s:"L'acqua scorre via subito e il vaso resta leggero",c:"Pane di terra asciugato troppo: diventa idrorepellente e l'acqua scivola lungo le pareti senza bagnare niente.",f:["Immergi il vaso in una bacinella per dieci minuti, poi scola bene.","Vale sempre per i substrati a base di corteccia, che sono i pi\xF9 difficili da riumidire."],r:["la Vellutata","Kinder Sorpresa"]},{id:"ragnetto",cat:"bestie",s:"Ragnatele finissime tra le foglie, puntini che si muovono",c:"Ragnetto rosso. Ama il caldo secco e attacca prima le foglie basse, sul rovescio. \xC8 il parassita che uccide pi\xF9 alocasie.",f:["Doccia con acqua tiepida sul rovescio delle foglie, con insistenza.","Avvia un ciclo di neem: tre passate a sette giorni di distanza, la sera.","Alza l'umidit\xE0: al secco si riproduce in pochi giorni."],r:["Anastasia","Polly","Eevee","Sua Maest\xE0"]},{id:"cocciniglia-farinosa",cat:"bestie",s:"Batuffoli bianchi cotonosi dove la foglia incontra il fusto",c:"Cocciniglia farinosa. Si nasconde nelle ascelle e sotto i bordi del vaso, e passa da una pianta all'altra se si toccano.",f:["Toglila una a una con un cotton fioc imbevuto di alcol.","Poi neem su tutta la pianta, e isola quella colpita finch\xE9 non \xE8 pulita.","Controlla anche il terriccio: alcune specie stanno sulle radici."],r:["la Vellutata","la Delizia","Stefani"]},{id:"cocciniglia-bruna",cat:"bestie",s:"Scudetti marroni fermi sui piccioli, appiccicaticcio sulle foglie",c:"Cocciniglia bruna. Sembrano crosticine e non si muovono: quello che appiccica \xE8 la loro melata, su cui poi cresce fumaggine nera.",f:["Staccale con l'unghia o uno spazzolino morbido.","Lava le foglie con acqua e poche gocce di sapone di Marsiglia, poi risciacqua.","Ripeti a distanza di dieci giorni: le uova sotto lo scudetto sopravvivono."],r:["Eevee","Sua Maest\xE0","la reggiana"]},{id:"sciaridi",cat:"bestie",s:"Moscerini che si alzano dal vaso quando lo muovi",c:"Sciaridi. Gli adulti sono innocui, le larve mangiano le radichette e vivono solo in terriccio costantemente umido.",f:["Lascia asciugare i primi 3 cm: senza umido in superficie il ciclo si interrompe.","Uno strato di lapillo o sabbia sopra il terriccio impedisce la deposizione.","Le trappole gialle adesive prendono gli adulti ma non risolvono da sole."],r:["Immobile","la Montanara","Drama queen"]},{id:"tripidi",cat:"bestie",s:"Foglie con aree argentate e puntini neri, deformate da nuove",c:"Tripidi. Sono minuscoli e velocissimi, e danneggiano le foglie mentre sono ancora arrotolate: il danno si vede quando \xE8 gi\xE0 fatto.",f:["Neem ripetuto ogni sette giorni per almeno tre cicli.","Taglia le foglie pi\xF9 colpite: non guariscono.","Sono i pi\xF9 tenaci: aspettati un mese di lavoro."],r:["Anastasia","Polly","la Vellutata"]},{id:"macchie-fungine",cat:"funghi",s:"Macchie brune con un alone giallo attorno",c:"Macchie fogliari fungine o batteriche. Partono quasi sempre da foglie bagnate che restano umide tutta la notte.",f:["Taglia le foglie colpite e buttale, non nel compost.","Non nebulizzare la sera: le foglie devono asciugare prima del buio.","Aumenta la circolazione d'aria fra le piante."],r:["la Religiosa","lumaca","Drama queen"]},{id:"oidio",cat:"funghi",s:"Patina bianca polverosa sulle foglie",c:"Oidio, il mal bianco. Arriva con aria ferma e sbalzi di temperatura, pi\xF9 che con l'umidit\xE0.",f:["Pulisci le foglie con un panno umido e isola la pianta.","Bicarbonato in acqua o zolfo bagnabile sulle parti colpite.","Distanzia le piante: l'aria ferma \xE8 la causa principale."],r:["Polka","la madonna"]},{id:"muffa-terriccio",cat:"funghi",s:"Muffa bianca soffice sulla superficie del terriccio",c:"Quasi sempre innocua: sono funghi saprofiti che mangiano materia organica. Segnalano per\xF2 che quel terriccio resta troppo umido.",f:["Raschia via lo strato superficiale e lascia asciugare di pi\xF9.","Non serve nessun trattamento: sparisce da sola quando la superficie asciuga."],r:["Immobile","Kinder Sorpresa"]},{id:"sali",cat:"concime",s:"Crosta bianca sul terriccio o sul bordo del vaso",c:"Accumulo di sali, da concime in eccesso o acqua dura. I sali richiamano acqua fuori dalle radici e le bruciano.",f:["Dilava: acqua abbondante che esce dal foro, ripetuta tre o quattro volte.","Sospendi il concime per due mesi.","Se l'acqua \xE8 dura, passa alla demineralizzata."],r:["Sua Maest\xE0","Aracne","la reggiana"]},{id:"carenza",cat:"concime",s:"Foglie nuove piccole e pallide, crescita ferma in piena stagione",c:"Carenza di nutrienti: substrato esaurito o mai concimato. Nei substrati a base di corteccia succede prima, perch\xE9 trattengono poco.",f:["Riprendi il concime a mezza dose e osserva la foglia successiva.","Se non cambia niente in due mesi, il problema \xE8 la luce o le radici, non il cibo."],r:["la Vellutata","Kinder Sorpresa"]},{id:"punte-secche",cat:"aria",s:"Punte e bordi marroni e croccanti",c:"Aria secca, calcare nell'acqua o entrambi. Il sintomo pi\xF9 frainteso di tutti: sembra sete e non lo \xE8.",f:["Passa ad acqua demineralizzata o piovana.","Raggruppa le piante e allontanale dai termosifoni.","Le punte gi\xE0 secche non tornano verdi: taglia seguendo il profilo della foglia."],r:["lumaca","la Religiosa","Aracne","Sua Maest\xE0"]},{id:"arricciate",cat:"aria",s:"Foglie arricciate verso l'interno",c:"La pianta riduce la superficie esposta per perdere meno acqua: aria troppo secca, oppure radici che non riescono ad assorbire.",f:["Controlla prima il terriccio: se \xE8 bagnato, il problema sono le radici, non l'aria.","Se \xE8 asciutto e l'aria \xE8 secca, alza l'umidit\xE0 raggruppando le piante."],r:["Drama queen","lumaca","la Religiosa"]},{id:"filatura",cat:"luce",s:"Steli lunghi e spogli, foglie piccole e distanti",c:"Filatura: la pianta si allunga cercando la luce. \xC8 il segnale pi\xF9 affidabile di posizione sbagliata.",f:["Spostala pi\xF9 vicino a una finestra, in modo graduale.","Pota gli steli filati: ricrescer\xE0 pi\xF9 compatta.","Sulle variegate la luce scarsa fa anche tornare verdi le parti chiare."],r:["la Gaga","Polka","la Salvata"]},{id:"scottatura",cat:"luce",s:"Macchie chiare, sbiancate o secche al centro della foglia",c:"Scottatura da sole diretto, spesso attraverso un vetro che concentra il calore.",f:["Sposta la pianta o schermala con una tenda leggera.","Le parti bruciate non guariscono: si taglia la foglia solo se \xE8 compromessa per pi\xF9 di met\xE0."],r:["la Religiosa","lumaca","Immobile"]}],tf=[{k:"foglie",t:"Sulle foglie"},{k:"terra",t:"Sul terriccio"},{k:"base",t:"Sul fusto o alla base"},{k:"crescita",t:"Nella crescita"},{k:"bestie",t:"Vedo insetti"}],$s=[{z:"foglie",t:"Ingialliscono",d:"Come \xE8 il terriccio adesso?",r:[["Bagnato o umido",["marciume-radici"]],["Asciutto",["sete","carenza"]]]},{z:"foglie",t:"Punte e bordi marroni e croccanti",esiti:["punte-secche","sali"]},{z:"foglie",t:"Macchie brune con alone giallo",esiti:["macchie-fungine"]},{z:"foglie",t:"Macchie chiare o sbiancate",esiti:["scottatura"]},{z:"foglie",t:"Patina bianca polverosa",esiti:["oidio"]},{z:"foglie",t:"Aree argentate e foglie deformi",esiti:["tripidi"]},{z:"foglie",t:"Afflosciate di colpo",d:"Come \xE8 il terriccio adesso?",r:[["Asciutto",["sete"]],["Bagnato",["marciume-radici"]]]},{z:"foglie",t:"Arricciate verso l'interno",esiti:["arricciate","punte-secche"]},{z:"foglie",t:"Appiccicose al tatto",esiti:["cocciniglia-bruna"]},{z:"terra",t:"Muffa bianca soffice in superficie",esiti:["muffa-terriccio"]},{z:"terra",t:"Crosta bianca dura sul bordo",esiti:["sali"]},{z:"terra",t:"Resta bagnato per giorni",esiti:["substrato-bagnato","marciume-radici"]},{z:"terra",t:"L'acqua scorre via subito",esiti:["idrorepellente"]},{z:"terra",t:"Moscerini che volano via",esiti:["sciaridi"]},{z:"base",t:"Base molle e scura",esiti:["marciume-colletto"]},{z:"base",t:"Batuffoli bianchi cotonosi",esiti:["cocciniglia-farinosa"]},{z:"base",t:"Crosticine marroni attaccate",esiti:["cocciniglia-bruna"]},{z:"crescita",t:"Steli lunghi e foglie distanti",esiti:["filatura"]},{z:"crescita",t:"Foglie nuove piccole e pallide",esiti:["carenza","filatura"]},{z:"crescita",t:"Ferma da mesi",d:"Da quanto non la rinvasi?",r:[["Pi\xF9 di due anni o non lo so",["substrato-bagnato","carenza"]],["Di recente",["marciume-radici","filatura"]]]},{z:"bestie",t:"Ragnatele finissime e puntini mobili",esiti:["ragnetto"]},{z:"bestie",t:"Batuffoli bianchi cotonosi",esiti:["cocciniglia-farinosa"]},{z:"bestie",t:"Scudetti marroni immobili",esiti:["cocciniglia-bruna"]},{z:"bestie",t:"Moscerini attorno al vaso",esiti:["sciaridi"]},{z:"bestie",t:"Insetti minuscoli e velocissimi",esiti:["tripidi"]}],Ci={"Monstera deliciosa":{f:"Araceae",o:"Messico meridionale e Panama",h:"Emiemifita: germina a terra, trova un tronco e ci sale sopra usando radici aeree, perdendo poi il contatto col suolo.",c:"I buchi non sono un vezzo: lasciano passare il vento e la luce alle foglie sottostanti nel sottobosco. Compaiono solo con la maturit\xE0, e il frutto maturo \xE8 l'unica parte commestibile della pianta.",t:"Tossica: tutta la pianta contiene ossalati di calcio, che bruciano bocca e gola."},"Monstera adansonii":{f:"Araceae",o:"America centrale e meridionale",h:"Rampicante di sottobosco, sale sui tronchi in ombra parziale.",c:"Le fenestrazioni ci sono fin da giovane, al contrario della deliciosa. In natura arriva a coprire interi tronchi.",t:"Tossica: ossalati di calcio."},"Monstera adansonii variegata":{f:"Araceae",o:"Selezione orticola",h:"Come la specie, ma le parti bianche non fanno fotosintesi.",c:"La variegatura \xE8 una mutazione instabile: la pianta pu\xF2 tornare tutta verde, e in quel caso cresce molto pi\xF9 in fretta perch\xE9 smette di sprecare energia.",t:"Tossica: ossalati di calcio."},Alocasia:{f:"Araceae",o:"Sud-est asiatico e Australia orientale",h:"Sottobosco umido tropicale, da rizoma o tubero.",c:"In inverno pu\xF2 perdere tutte le foglie ed entrare in dormienza: sembra morta ma il tubero \xE8 vivo, e ributta a marzo. \xC8 il motivo per cui ne finiscono migliaia nel bidone ogni anno.",t:"Tossica: ossalati di calcio, tra le pi\xF9 irritanti del gruppo."},"Alocasia amazonica (Polly)":{f:"Araceae",o:"Nessuna: \xE8 un ibrido di vivaio",h:"Incrocio orticolo, in natura non esiste.",c:"Il nome inganna: non ha niente a che fare con l'Amazzonia. Deriva dal vivaio Amazon Nursery della Florida, dove l'ibrido fu creato negli anni Cinquanta.",t:"Tossica: ossalati di calcio."},"Anthurium regale":{f:"Araceae",o:"Per\xF9",h:"Epifita: cresce aggrappata ai tronchi, con le radici all'aria.",c:"Le foglie velluto arrivano a un metro in natura. Quell'effetto vellutato viene da cellule epidermiche a cupola che catturano la poca luce del sottobosco, ed \xE8 anche il motivo per cui una goccia d'acqua lascia il segno per sempre.",t:"Tossica: ossalati di calcio."},"Anthurium warocqueanum":{f:"Araceae",o:"Colombia",h:"Epifita di foresta nebulosa, tra i 200 e i 1500 metri.",c:"La chiamano queen anthurium: le foglie pendenti superano il metro e mezzo. Cresce lentissima e vuole umidit\xE0 che in casa non esiste, ed \xE8 per questo che \xE8 una delle piante pi\xF9 difficili in commercio.",t:"Tossica: ossalati di calcio."},"Ravenea rivularis (palma majesty)":{f:"Arecaceae",o:"Madagascar, endemica",h:"Cresce lungo i corsi d'acqua, con le radici quasi sempre umide.",c:"In natura arriva a dodici metri, e in Madagascar \xE8 minacciata: ne restano poche popolazioni selvatiche. Quella che compri nei supermercati \xE8 tutta da coltivazione.",t:"Non tossica."},"Epipremnum aureum (pothos)":{f:"Araceae",o:"Moorea, Polinesia francese",h:"Rampicante che in natura sale sugli alberi fino a venti metri.",c:"Le foglie che conosci sono giovanili: se lasciata salire su un tronco produce foglie da un metro, fenestrate come una monstera. \xC8 anche una specie invasiva grave in molte zone tropicali.",t:"Tossica: ossalati di calcio."},"Spathiphyllum (spatifillo)":{f:"Araceae",o:"America centrale e Colombia",h:"Sottobosco umido di foresta pluviale.",c:"Il fiore non \xE8 il fiore: la parte bianca \xE8 una brattea, e i fiori veri sono i puntini sulla pannocchia centrale. Fiorisce solo con abbastanza luce, quindi in penombra resta verde per anni.",t:"Tossica: ossalati di calcio."},"Maranta leuconeura":{f:"Marantaceae",o:"Foresta pluviale brasiliana",h:"Tappezzante di sottobosco, in ombra profonda.",c:"Di notte alza le foglie e le chiude come mani giunte: si chiama nictinastia ed \xE8 un movimento vero, guidato da cuscinetti d'acqua alla base del picciolo. Da l\xEC il nome di pianta della preghiera.",t:"Non tossica."},Calathea:{f:"Marantaceae",o:"America tropicale",h:"Sottobosco umido, all'ombra di alberi alti.",c:"Nel 2012 gran parte delle calathee \xE8 stata riclassificata nel genere Goeppertia: quello che compri come Calathea spesso ha gi\xE0 un altro nome scientifico.",t:"Non tossica."},"Fittonia albivenis":{f:"Acanthaceae",o:"Per\xF9 e bacino amazzonico",h:"Tappeto del sottobosco, in ombra e umidit\xE0 costante.",c:"Il reticolo bianco sono le nervature: albivenis vuol dire proprio vene bianche. Il crollo teatrale quando ha sete \xE8 un meccanismo di risparmio idrico, non un danno.",t:"Non tossica."},"Chlorophytum (spider plant)":{f:"Asparagaceae",o:"Africa australe",h:"Sottobosco e zone rocciose, con radici tuberose che immagazzinano acqua.",c:"Fa figli su stoloni lunghi anche un metro: \xE8 una delle poche piante d'appartamento che si clona da sola. Ed \xE8 tra le pochissime del tutto sicure per i gatti.",t:"Non tossica."},"Sansevieria (snake plant)":{f:"Asparagaceae",o:"Africa occidentale tropicale",h:"Zone aride e rocciose, in pieno sole o mezz'ombra.",c:"Dal 2017 il genere Sansevieria \xE8 stato assorbito in Dracaena. Fa fotosintesi CAM: apre gli stomi di notte per perdere meno acqua, come i cactus.",t:"Lievemente tossica se ingerita."},"Sansevieria intrecciata":{f:"Asparagaceae",o:"Africa occidentale tropicale",h:"Come la specie: l'intreccio \xE8 lavorazione da vivaio.",c:"Le foglie sono state legate da giovani e sono cresciute cos\xEC. Nel punto d'incrocio l'acqua ristagna, ed \xE8 l\xEC che comincia il marciume.",t:"Lievemente tossica se ingerita."},"Peperomia polybotrya (raindrop)":{f:"Piperaceae",o:"Per\xF9 e Colombia",h:"Epifita e rupicola, spesso su rocce coperte di muschio.",c:"Parente stretta del pepe nero. Le foglie carnose sono una riserva d'acqua: per questo tollera di essere dimenticata e non tollera il terriccio zuppo.",t:"Non tossica."},"Peperomia obtusifolia":{f:"Piperaceae",o:"Florida, Caraibi e Sud America",h:"Epifita nelle foreste umide, su tronchi e ceppaie.",c:"Si moltiplica da una sola foglia con un pezzo di picciolo: una delle propagazioni pi\xF9 facili che esistano.",t:"Non tossica."},"Phlebodium aureum (felce blu)":{f:"Polypodiaceae",o:"America tropicale e subtropicale",h:"Epifita: vive sui tronchi e alla base delle palme, mai nella terra.",c:"Il rizoma \xE8 coperto di squame dorate, da cui aureum. La sfumatura azzurra viene da una cera superficiale che riflette la luce: se strofini le foglie va via e non torna.",t:"Non tossica."},"Felce rustica da esterno":{f:"Dryopteridaceae",o:"Boschi temperati dell'emisfero nord",h:"Sottobosco fresco e ombroso, su terreni ricchi di foglie decomposte.",c:"Le felci non hanno n\xE9 fiori n\xE9 semi: si riproducono con spore, e sulla pagina inferiore delle fronde vedrai i sori, i puntini scuri che le contengono.",t:"Non tossica per contatto."},"Hedera helix (edera)":{f:"Araliaceae",o:"Europa e Asia occidentale",h:"Rampicante di bosco, si arrampica con radichette avventizie.",c:"Ha due forme distinte: da giovane rampicante con foglie a lobi, da adulta arbustiva con foglie intere, e solo in quella forma fiorisce. Le talee mantengono la forma da cui provengono.",t:"Tossica: bacche e foglie contengono saponine."},"Pilea peperomioides":{f:"Urticaceae",o:"Yunnan, Cina sud-occidentale",h:"Rupicola: cresce su rocce ombrose ai piedi dell'Himalaya.",c:"Per decenni \xE8 stata quasi sconosciuta ai botanici occidentali: si \xE8 diffusa in Europa dagli anni Quaranta passando di mano in mano come talea, portata da un missionario norvegese, prima ancora di essere identificata con certezza.",t:"Non tossica."},"Hypoestes (polka dot)":{f:"Acanthaceae",o:"Madagascar",h:"Sottobosco umido.",c:"Le macchie rosa sono aree prive di clorofilla: pi\xF9 luce riceve, pi\xF9 il disegno \xE8 marcato. In ombra sbiadisce e la pianta si allunga.",t:"Non tossica."},"Sedum nussbaumerianum":{f:"Crassulaceae",o:"Veracruz, Messico",h:"Scarpate rocciose assolate, con pochissimo suolo.",c:"Le foglie virano al rame per proteggersi dall'eccesso di luce: \xE8 un pigmento protettivo, quindi il colore che ti piace \xE8 letteralmente una scottatura controllata. La patina bianca sopra \xE8 cera, e una volta tolta con le dita non ricresce su quella foglia.",t:"Non tossica."},Philodendron:{f:"Araceae",o:"America tropicale",h:"Rampicanti ed emiemifite di foresta pluviale.",c:"\xC8 il secondo genere pi\xF9 numeroso delle Araceae: quasi cinquecento specie descritte, e molte ancora no.",t:"Tossica: ossalati di calcio."}},qv=["deliciosa","adansonii","adansonii-solo","pothos","pothos-acqua","alocasia","polly","anthurium-regale","anthurium-serra","spatifillo","maranta","calathea","fittonia","polkadot","raindrop","peperomia","sedum","snake","snake-intrecciata","spider","palma","felce","felce-blu","felce-montagna","edera-acqua","pilea-acqua","generica"],nf="cura-piante:v2",af="cura-piante:io",of=`
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

.cp *, .cp *::before, .cp *::after { box-sizing: border-box; }
.cp {
  --foglia:#16241F; --carta:#E4EAE1; --scheda:#F4F7F2; --pieno:#FFFFFF; --acqua:#2E6F8E;
  --acqua-chiara:#8FBECF; --secco:#B0762A; --tenue:#6C7A70; --linea:#C9D3C6;
  --errore-fondo:#FBEDE0; --errore-testo:#7A4E14; --lumi:1;
  color-scheme:light;
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  overflow-x:hidden; max-width:100vw;
  background:var(--carta); color:var(--foglia); min-height:100%;
  padding:28px 18px 60px; line-height:1.5;
}

/* --- tema scuro --- */
.cp.scuro {
  --foglia:#E7EEE6; --carta:#0E1915; --scheda:#16241E; --pieno:#1C2E27; --acqua:#74AEC9;
  --acqua-chiara:#3F7189; --secco:#D2A05B; --tenue:#93A79A; --linea:#2B3E35;
  --errore-fondo:#33261A; --errore-testo:#E0B47E; --lumi:1.42;
  color-scheme:dark;
}
.cp.scuro .cp-previsione { margin:0 0 16px; padding:9px 12px; border-radius:9px; background:rgba(76,122,99,.12);
  font-size:12.5px; line-height:1.45; color:#3D6551; }
.cp-previsione.ora { background:rgba(176,118,42,.12); color:var(--secco); }
.cp.scuro .cp-previsione { background:rgba(120,175,145,.14); color:#9CC7AC; }
.cp-metodo { background:rgba(116,174,201,.13); }
.cp.scuro .cp-parte { background:rgba(116,174,201,.15); }
.cp.scuro .cp-distintivo.preso { background:rgba(116,174,201,.12); }
.cp.scuro .cp-distintivo.dipianta.preso { background:rgba(120,175,145,.14); }
.cp.scuro .cp-distintivo.eraSegreto.preso { background:rgba(210,160,91,.13); }
.cp.scuro .cp-annullo { box-shadow:0 6px 22px rgba(0,0,0,.5); }
.cp.scuro .cp-velo-pieno { align-items:stretch !important; padding:0 !important; }
.cp-velo-pieno { animation:velo .25s ease both; }
@keyframes velo { from { opacity:0 } to { opacity:1 } }
@keyframes sale { from { opacity:0; transform:translateY(22px) scale(.97) } to { opacity:1; transform:none } }
.cp-foglio-ill svg { animation:ingrandisce .45s cubic-bezier(.3,1.2,.4,1) both; }
@keyframes ingrandisce { from { opacity:0; transform:scale(.55) } to { opacity:1; transform:none } }
.cp-foglio { animation:sale .34s cubic-bezier(.2,.9,.3,1) both; background:var(--carta);
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch; max-height:100dvh; width:100%; max-width:640px; margin:0 auto; padding:22px 18px calc(28px + env(safe-area-inset-bottom));
  overflow-y:auto; padding-top:calc(22px + env(safe-area-inset-top)); }
.cp-foglio-testa { display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; }
.cp-foglio-ill { flex:0 0 76px; height:76px; }
.cp-chiudi { margin-left:auto; border:0; background:none; font-size:26px; line-height:1; color:var(--tenue); cursor:pointer; padding:0 4px; }
.cp-periodo { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:20px; font-size:13px; color:var(--tenue); }
.cp-periodo input { margin-left:6px; padding:6px 9px; border:1px solid var(--linea); border-radius:8px; font:inherit; font-size:13px;
  background:var(--pieno); color:var(--foglia); }
.cp-lib-titolo { font-family:'Fraunces',ui-serif,Georgia,serif; font-size:26px; font-weight:600; margin:0 0 4px; }
.cp-lib-sotto { font-size:12.5px; color:var(--tenue); margin:0 0 22px; }
.cp-lib-sez { margin-bottom:22px; }

 sia la piena estate che il pieno riposo",m:2,v:e=>e.estremi},{id:"collezionetotale",ic:"corona",segreto:!0,t:"Il grande giardino",d:"Cinquanta piante seguite insieme",m:50,v:e=>e.piante},{id:"curioso",ic:"bussola",t:"Esploratore",segreto:!0,d:"Aver visitato Storico, Terricci e il profilo",m:3,v:e=>e.esplorate}],Fh=["Il mese pi\xF9 buio dell'anno: acqua ridotta al minimo, niente concime, e occhio all'aria secca dei termosifoni.","La luce comincia a tornare ma le piante dormono ancora. Buon momento per procurarti corteccia, perlite e vasi in vista di marzo.","Riparte tutto: \xE8 il mese dei rinvasi e del ritorno al concime, meglio a met\xE0 dose per le prime due volte. Rimetti la stagione su crescita.","Crescita piena. Le prime foglie nuove arrivano adesso: segnale che gli intervalli invernali vanno accorciati.","Il mese di massimo vigore, il migliore per talee e propagazioni. Tutto quello che tagli adesso radica in fretta.","Col caldo i consumi d'acqua salgono. Attenzione al sole diretto attraverso i vetri, che scotta le foglie in poche ore.","Mese critico: caldo secco e ragnetto rosso. Controlla il rovescio delle foglie pi\xF9 spesso del solito.","Se parti, raggruppa le assetate in bagno e lascia stare le grasse. Al rientro, controllo parassiti su tutto.","Ultimo concime pieno dell'anno e ultima finestra utile per un rinvaso leggero: dopo, le radici non fanno in tempo a riprendersi.","Si rallenta: passa la stagione a riposo. I termosifoni che si accendono asciugano l'aria di colpo, pi\xF9 del terriccio.","Poca luce e crescita quasi ferma. Riduci l'acqua e sospendi del tutto il concime.","Minimo assoluto. Non rinvasare, non potare, non concimare: qualsiasi stress ora non viene recuperato."],lf={morta:"Non ce l'ha fatta",regalata:"Regalata",ceduta:"Data via",altro:"Altro"};function oi(e="breve"){try{if(navigator.vibrate){navigator.vibrate(e==="forte"?[12,30,18]:10);return}let t=document.getElementById("scatto-tattile");t&&(t.checked=!t.checked,t.dispatchEvent(new Event("change")))}catch{}}var Dh=[{id:"rubinetto",t:"Rubinetto",costo:"gratis",come:"Direttamente dal lavandino.",risolve:"Va benissimo per la maggior parte delle piante d'appartamento.",problema:"Se la tua zona ha acqua dura, lascia depositi di calcare e con gli anni alza il pH del terriccio."},{id:"riposata",t:"Riposata una notte",costo:"gratis",come:"Riempi una brocca aperta e lasciala fuori 12-24 ore prima di usarla.",risolve:"Il cloro evapora e l'acqua arriva a temperatura ambiente, il che evita lo shock alle radici.",problema:"Non toglie il calcare: quello resta tutto. E se il tuo acquedotto usa cloramine al posto del cloro, non evaporano nemmeno quelle."},{id:"demi",t:"Demineralizzata",costo:"circa 1 \u20AC per 5 litri",come:"Al supermercato, nel reparto ferri da stiro. Cerca la tacca che dice solo \u201Cacqua demineralizzata\u201D, senza profumi n\xE9 additivi: quelle profumate rovinano le radici.",risolve:"Zero calcare e zero sali. \xC8 la soluzione pi\xF9 semplice ed economica che esista.",problema:"Essendo priva di minerali, a lungo andare la pianta dipende solo dal concime: non saltarlo."},{id:"piovana",t:"Piovana",costo:"gratis",come:"Un secchio sul balcone quando piove. Scarta i primi minuti di pioggia, che lavano via lo sporco dall'aria, e tienila al buio: alla luce diventa verde di alghe in una settimana.",risolve:"\xC8 l'acqua migliore in assoluto: leggermente acida, senza calcare, con qualche minerale utile.",problema:"Non \xE8 raccoglibile tutto l'anno, e non usarla se scende da una grondaia trattata o da un tetto in bitume."},{id:"condensa",t:"Condensa del deumidificatore",costo:"gratis",come:"\xC8 l'acqua nella tanica del deumidificatore o dello split del condizionatore.",risolve:"\xC8 praticamente distillata: zero calcare. Il modo pi\xF9 economico di avere acqua pura senza comprarla.",problema:"Solo se l'apparecchio \xE8 pulito: nei filtri sporchi si accumulano batteri. Mai usarla su piante che poi mangi."},{id:"osmosi",t:"Osmosi inversa",costo:"150-400 \u20AC l'impianto",come:"Un filtro sotto il lavello che spinge l'acqua attraverso una membrana finissima e trattiene quasi tutto. Alcuni frigoriferi e caraffe avanzate ce l'hanno gi\xE0.",risolve:"Acqua pura come la distillata, ma dal rubinetto e senza comprare bottiglie.",problema:"Costa, va installata, e per ogni litro buono ne scarta due o tre. Ha senso solo se la usi anche per bere."},{id:"caraffa",t:"Caraffa filtrante",costo:"30 \u20AC pi\xF9 i filtri",come:"Le classiche caraffe da frigorifero.",risolve:"Abbassa un po' la durezza e toglie il cloro.",problema:"Non demineralizza: riduce il calcare solo in parte, e la capacit\xE0 cala man mano che il filtro si esaurisce. Meglio di niente, lontana dalla demineralizzata."},{id:"bollita",t:"Bollita",costo:"gratis",come:"Si fa bollire e si lascia raffreddare, usando solo la parte superiore.",risolve:"Fa precipitare sul fondo una parte del calcare, quello dei carbonati.",problema:"Gli altri sali restano e anzi si concentrano, perch\xE9 parte dell'acqua evapora. \xC8 il rimedio che sembra intelligente e funziona meno di tutti."}],li={ripresa:{t:"Ripresa",mesi:"marzo-maggio",acqua:1,concime:1,dose:"mezza dose le prime due volte",nota:"Riparte tutto: \xE8 la finestra giusta per i rinvasi e per ricominciare a concimare, ma piano."},piena:{t:"Piena",mesi:"giugno-agosto",acqua:.85,concime:.85,dose:"dose piena",nota:"Massimo vigore e consumi d'acqua pi\xF9 alti: gli intervalli si accorciano da soli."},rallenta:{t:"Rallentamento",mesi:"settembre-novembre",acqua:1.3,concime:1.6,dose:"ultima concimazione a settembre",nota:"La luce cala e la crescita frena. Si allunga fra un'annaffiatura e l'altra e si chiude col concime."},riposo:{t:"Riposo",mesi:"dicembre-febbraio",acqua:1.75,concime:0,dose:"niente concime",nota:"Le piante dormono. Acqua molto ridotta, concime sospeso e nessun intervento traumatico."}},$h=["ripresa","piena","rallenta","riposo"],fn=e=>e>=2&&e<=4?"ripresa":e>=5&&e<=7?"piena":e>=8&&e<=10?"rallenta":"riposo",ca={nessuno:{t:"Nessuno",nota:""},"palo-cocco":{t:"Palo di cocco",nota:"Bagnalo a ogni annaffiatura: le radici aeree ci si aggrappano solo se \xE8 umido, ed \xE8 questo che fa crescere le foglie pi\xF9 grandi."},tutore:{t:"Tutore singolo",nota:"Legature morbide e larghe: un filo stretto strozza il fusto man mano che ingrossa."},traliccio:{t:"Traliccio o arco",nota:"Guida i getti man mano, non tutti insieme: i tralci maturi si spezzano se piegati di colpo."},pensile:{t:"Vaso pensile",nota:"Ricade invece di salire: taglia le punte ogni tanto o si spoglia alla base."}},js={troppa:{t:"Troppa acqua",ic:"annega"},poca:{t:"Poca acqua",ic:"assetata"},bestie:{t:"Parassiti",ic:"insetto"},funghi:{t:"Funghi",ic:"fungo"},concime:{t:"Concime",ic:"sale"},aria:{t:"Umidit\xE0",ic:"vapore"},luce:{t:"Luce",ic:"sole"}},mn=[{id:"marciume-radici",cat:"troppa",s:"Foglie gialle e terriccio ancora bagnato",c:"Marciume radicale: le radici affogate non assorbono pi\xF9, quindi la pianta ingiallisce come se avesse sete. \xC8 l'inganno pi\xF9 comune, e chi annaffia di pi\xF9 la finisce.",f:["Sfila il pane di terra e guarda: radici bianche o sode stanno bene, brune e molli sono marce.","Taglia tutto il marcio con forbici pulite, rinvasa in substrato asciutto e pi\xF9 drenante.","Non annaffiare per una settimana e non concimare per un mese."],sp:["Calathea","Maranta","Fittonia","Peperomia","Phlebodium","Felce","Spathiphyllum"]},{id:"marciume-colletto",cat:"troppa",s:"Base del fusto molle, scura, che cede al tocco",c:"Marciume del colletto: parte dal punto dove il fusto entra nel terriccio, spesso perch\xE9 l'acqua ristagna l\xEC o \xE8 finita nel cuore della rosetta.",f:["Sulle sansevierie e sulle grasse \xE8 quasi sempre fatale sotto quel punto: taglia sopra il marcio e fai radicare la parte sana.","Annaffia dal basso o lungo il bordo del vaso, mai al centro."],sp:["Sansevieria","Sedum","Crassul"]},{id:"substrato-bagnato",cat:"troppa",s:"Il terriccio resta bagnato per pi\xF9 di una settimana",c:"Substrato compattato o vaso troppo grande: la terra dove non arrivano radici trattiene acqua e basta.",f:["Rinvasa in un vaso solo 2-4 cm pi\xF9 largo, con pi\xF9 perlite o corteccia.","Verifica che il foro di drenaggio non sia otturato dalle radici."],sp:["Anthurium","Phlebodium","Monstera","Philodendron"]},{id:"sete",cat:"poca",s:"Foglie afflosciate di colpo, terriccio asciutto",c:"Solo sete. Alcune specie crollano in modo teatrale e si rialzano in un'ora.",f:["Annaffia bene e aspetta: se si rialza era quello.","Se lo fa spesso, accorcia l'intervallo: ogni crollo costa qualche radichetta."],sp:["Spathiphyllum","Fittonia","Hypoestes","Maranta"]},{id:"idrorepellente",cat:"poca",s:"L'acqua scorre via subito e il vaso resta leggero",c:"Pane di terra asciugato troppo: diventa idrorepellente e l'acqua scivola lungo le pareti senza bagnare niente.",f:["Immergi il vaso in una bacinella per dieci minuti, poi scola bene.","Vale sempre per i substrati a base di corteccia, che sono i pi\xF9 difficili da riumidire."],sp:["Anthurium","Phlebodium","Monstera"]},{id:"ragnetto",cat:"bestie",s:"Ragnatele finissime tra le foglie, puntini che si muovono",c:"Ragnetto rosso. Ama il caldo secco e attacca prima le foglie basse, sul rovescio. \xC8 il parassita che uccide pi\xF9 alocasie.",f:["Doccia con acqua tiepida sul rovescio delle foglie, con insistenza.","Avvia un ciclo di neem: tre passate a sette giorni di distanza, la sera.","Alza l'umidit\xE0: al secco si riproduce in pochi giorni."],sp:["Alocasia","Hedera","Howea","Monstera","Anthurium"]},{id:"cocciniglia-farinosa",cat:"bestie",s:"Batuffoli bianchi cotonosi dove la foglia incontra il fusto",c:"Cocciniglia farinosa. Si nasconde nelle ascelle e sotto i bordi del vaso, e passa da una pianta all'altra se si toccano.",f:["Toglila una a una con un cotton fioc imbevuto di alcol.","Poi neem su tutta la pianta, e isola quella colpita finch\xE9 non \xE8 pulita.","Controlla anche il terriccio: alcune specie stanno sulle radici."],sp:["Anthurium","Monstera","Philodendron","Epipremnum"]},{id:"cocciniglia-bruna",cat:"bestie",s:"Scudetti marroni fermi sui piccioli, appiccicaticcio sulle foglie",c:"Cocciniglia bruna. Sembrano crosticine e non si muovono: quello che appiccica \xE8 la loro melata, su cui poi cresce fumaggine nera.",f:["Staccale con l'unghia o uno spazzolino morbido.","Lava le foglie con acqua e poche gocce di sapone di Marsiglia, poi risciacqua.","Ripeti a distanza di dieci giorni: le uova sotto lo scudetto sopravvivono."],sp:["Hedera","Howea","Sansevieria","Epipremnum"]},{id:"sciaridi",cat:"bestie",s:"Moscerini che si alzano dal vaso quando lo muovi",c:"Sciaridi. Gli adulti sono innocui, le larve mangiano le radichette e vivono solo in terriccio costantemente umido.",f:["Lascia asciugare i primi 3 cm: senza umido in superficie il ciclo si interrompe.","Uno strato di lapillo o sabbia sopra il terriccio impedisce la deposizione.","Le trappole gialle adesive prendono gli adulti ma non risolvono da sole."],sp:["Felce","Phlebodium","Fittonia","Calathea"]},{id:"tripidi",cat:"bestie",s:"Foglie con aree argentate e puntini neri, deformate da nuove",c:"Tripidi. Sono minuscoli e velocissimi, e danneggiano le foglie mentre sono ancora arrotolate: il danno si vede quando \xE8 gi\xE0 fatto.",f:["Neem ripetuto ogni sette giorni per almeno tre cicli.","Taglia le foglie pi\xF9 colpite: non guariscono.","Sono i pi\xF9 tenaci: aspettati un mese di lavoro."],sp:["Alocasia","Anthurium","Monstera"]},{id:"macchie-fungine",cat:"funghi",s:"Macchie brune con un alone giallo attorno",c:"Macchie fogliari fungine o batteriche. Partono quasi sempre da foglie bagnate che restano umide tutta la notte.",f:["Taglia le foglie colpite e buttale, non nel compost.","Non nebulizzare la sera: le foglie devono asciugare prima del buio.","Aumenta la circolazione d'aria fra le piante."],sp:["Maranta","Calathea","Fittonia"]},{id:"oidio",cat:"funghi",s:"Patina bianca polverosa sulle foglie",c:"Oidio, il mal bianco. Arriva con aria ferma e sbalzi di temperatura, pi\xF9 che con l'umidit\xE0.",f:["Pulisci le foglie con un panno umido e isola la pianta.","Bicarbonato in acqua o zolfo bagnabile sulle parti colpite.","Distanzia le piante: l'aria ferma \xE8 la causa principale."],sp:["Hypoestes","Peperomia","Hedera"]},{id:"muffa-terriccio",cat:"funghi",s:"Muffa bianca soffice sulla superficie del terriccio",c:"Quasi sempre innocua: sono funghi saprofiti che mangiano materia organica. Segnalano per\xF2 che quel terriccio resta troppo umido.",f:["Raschia via lo strato superficiale e lascia asciugare di pi\xF9.","Non serve nessun trattamento: sparisce da sola quando la superficie asciuga."],sp:["Felce","Phlebodium","Anthurium"]},{id:"sali",cat:"concime",s:"Crosta bianca sul terriccio o sul bordo del vaso",c:"Accumulo di sali, da concime in eccesso o acqua dura. I sali richiamano acqua fuori dalle radici e le bruciano.",f:["Dilava: acqua abbondante che esce dal foro, ripetuta tre o quattro volte.","Sospendi il concime per due mesi.","Se l'acqua \xE8 dura, passa alla demineralizzata."],sp:["Howea","Chlorophytum","Sansevieria","Dracaena"]},{id:"carenza",cat:"concime",s:"Foglie nuove piccole e pallide, crescita ferma in piena stagione",c:"Carenza di nutrienti: substrato esaurito o mai concimato. Nei substrati a base di corteccia succede prima, perch\xE9 trattengono poco.",f:["Riprendi il concime a mezza dose e osserva la foglia successiva.","Se non cambia niente in due mesi, il problema \xE8 la luce o le radici, non il cibo."],sp:["Anthurium","Monstera","Philodendron"]},{id:"punte-secche",cat:"aria",s:"Punte e bordi marroni e croccanti",c:"Aria secca, calcare nell'acqua o entrambi. Il sintomo pi\xF9 frainteso di tutti: sembra sete e non lo \xE8.",f:["Passa ad acqua demineralizzata o piovana.","Raggruppa le piante e allontanale dai termosifoni.","Le punte gi\xE0 secche non tornano verdi: taglia seguendo il profilo della foglia."],sp:["Calathea","Maranta","Chlorophytum","Howea","Fittonia"]},{id:"arricciate",cat:"aria",s:"Foglie arricciate verso l'interno",c:"La pianta riduce la superficie esposta per perdere meno acqua: aria troppo secca, oppure radici che non riescono ad assorbire.",f:["Controlla prima il terriccio: se \xE8 bagnato, il problema sono le radici, non l'aria.","Se \xE8 asciutto e l'aria \xE8 secca, alza l'umidit\xE0 raggruppando le piante."],sp:["Fittonia","Calathea","Maranta"]},{id:"filatura",cat:"luce",s:"Steli lunghi e spogli, foglie piccole e distanti",c:"Filatura: la pianta si allunga cercando la luce. \xC8 il segnale pi\xF9 affidabile di posizione sbagliata.",f:["Spostala pi\xF9 vicino a una finestra, in modo graduale.","Pota gli steli filati: ricrescer\xE0 pi\xF9 compatta.","Sulle variegate la luce scarsa fa anche tornare verdi le parti chiare."],sp:["Monstera","Hypoestes","Epipremnum","Pilea"]},{id:"scottatura",cat:"luce",s:"Macchie chiare, sbiancate o secche al centro della foglia",c:"Scottatura da sole diretto, spesso attraverso un vetro che concentra il calore.",f:["Sposta la pianta o schermala con una tenda leggera.","Le parti bruciate non guariscono: si taglia la foglia solo se \xE8 compromessa per pi\xF9 di met\xE0."],sp:["Maranta","Calathea","Phlebodium","Fittonia"]}],sf=[{k:"foglie",t:"Sulle foglie"},{k:"terra",t:"Sul terriccio"},{k:"base",t:"Sul fusto o alla base"},{k:"crescita",t:"Nella crescita"},{k:"bestie",t:"Vedo insetti"}],Qs=[{z:"foglie",t:"Ingialliscono",d:"Come \xE8 il terriccio adesso?",r:[["Bagnato o umido",["marciume-radici"]],["Asciutto",["sete","carenza"]]]},{z:"foglie",t:"Punte e bordi marroni e croccanti",esiti:["punte-secche","sali"]},{z:"foglie",t:"Macchie brune con alone giallo",esiti:["macchie-fungine"]},{z:"foglie",t:"Macchie chiare o sbiancate",esiti:["scottatura"]},{z:"foglie",t:"Patina bianca polverosa",esiti:["oidio"]},{z:"foglie",t:"Aree argentate e foglie deformi",esiti:["tripidi"]},{z:"foglie",t:"Afflosciate di colpo",d:"Come \xE8 il terriccio adesso?",r:[["Asciutto",["sete"]],["Bagnato",["marciume-radici"]]]},{z:"foglie",t:"Arricciate verso l'interno",esiti:["arricciate","punte-secche"]},{z:"foglie",t:"Appiccicose al tatto",esiti:["cocciniglia-bruna"]},{z:"terra",t:"Muffa bianca soffice in superficie",esiti:["muffa-terriccio"]},{z:"terra",t:"Crosta bianca dura sul bordo",esiti:["sali"]},{z:"terra",t:"Resta bagnato per giorni",esiti:["substrato-bagnato","marciume-radici"]},{z:"terra",t:"L'acqua scorre via subito",esiti:["idrorepellente"]},{z:"terra",t:"Moscerini che volano via",esiti:["sciaridi"]},{z:"base",t:"Base molle e scura",esiti:["marciume-colletto"]},{z:"base",t:"Batuffoli bianchi cotonosi",esiti:["cocciniglia-farinosa"]},{z:"base",t:"Crosticine marroni attaccate",esiti:["cocciniglia-bruna"]},{z:"crescita",t:"Steli lunghi e foglie distanti",esiti:["filatura"]},{z:"crescita",t:"Foglie nuove piccole e pallide",esiti:["carenza","filatura"]},{z:"crescita",t:"Ferma da mesi",d:"Da quanto non la rinvasi?",r:[["Pi\xF9 di due anni o non lo so",["substrato-bagnato","carenza"]],["Di recente",["marciume-radici","filatura"]]]},{z:"bestie",t:"Ragnatele finissime e puntini mobili",esiti:["ragnetto"]},{z:"bestie",t:"Batuffoli bianchi cotonosi",esiti:["cocciniglia-farinosa"]},{z:"bestie",t:"Scudetti marroni immobili",esiti:["cocciniglia-bruna"]},{z:"bestie",t:"Moscerini attorno al vaso",esiti:["sciaridi"]},{z:"bestie",t:"Insetti minuscoli e velocissimi",esiti:["tripidi"]}],ri={"Monstera deliciosa":{f:"Araceae",o:"Messico meridionale e Panama",h:"Emiemifita: germina a terra, trova un tronco e ci sale sopra usando radici aeree, perdendo poi il contatto col suolo.",c:"I buchi non sono un vezzo: lasciano passare il vento e la luce alle foglie sottostanti nel sottobosco. Compaiono solo con la maturit\xE0, e il frutto maturo \xE8 l'unica parte commestibile della pianta.",t:"Tossica: tutta la pianta contiene ossalati di calcio, che bruciano bocca e gola."},"Monstera adansonii":{f:"Araceae",o:"America centrale e meridionale",h:"Rampicante di sottobosco, sale sui tronchi in ombra parziale.",c:"Le fenestrazioni ci sono fin da giovane, al contrario della deliciosa. In natura arriva a coprire interi tronchi.",t:"Tossica: ossalati di calcio."},"Monstera adansonii Mint (variegata)":{f:"Araceae",o:"Selezione orticola",h:"Come la specie, ma le parti bianche non fanno fotosintesi.",c:"La variegatura \xE8 una mutazione instabile: la pianta pu\xF2 tornare tutta verde, e in quel caso cresce molto pi\xF9 in fretta perch\xE9 smette di sprecare energia.",t:"Tossica: ossalati di calcio."},Alocasia:{f:"Araceae",o:"Sud-est asiatico e Australia orientale",h:"Sottobosco umido tropicale, da rizoma o tubero.",c:"In inverno pu\xF2 perdere tutte le foglie ed entrare in dormienza: sembra morta ma il tubero \xE8 vivo, e ributta a marzo. \xC8 il motivo per cui ne finiscono migliaia nel bidone ogni anno.",t:"Tossica: ossalati di calcio, tra le pi\xF9 irritanti del gruppo."},"Alocasia amazonica (Polly)":{f:"Araceae",o:"Nessuna: \xE8 un ibrido di vivaio",h:"Incrocio orticolo, in natura non esiste.",c:"Il nome inganna: non ha niente a che fare con l'Amazzonia. Deriva dal vivaio Amazon Nursery della Florida, dove l'ibrido fu creato negli anni Cinquanta.",t:"Tossica: ossalati di calcio."},"Anthurium regale":{f:"Araceae",o:"Per\xF9",h:"Epifita: cresce aggrappata ai tronchi, con le radici all'aria.",c:"Le foglie velluto arrivano a un metro in natura. Quell'effetto vellutato viene da cellule epidermiche a cupola che catturano la poca luce del sottobosco, ed \xE8 anche il motivo per cui una goccia d'acqua lascia il segno per sempre.",t:"Tossica: ossalati di calcio."},"Anthurium warocqueanum":{f:"Araceae",o:"Colombia",h:"Epifita di foresta nebulosa, tra i 200 e i 1500 metri.",c:"La chiamano queen anthurium: le foglie pendenti superano il metro e mezzo. Cresce lentissima e vuole umidit\xE0 che in casa non esiste, ed \xE8 per questo che \xE8 una delle piante pi\xF9 difficili in commercio.",t:"Tossica: ossalati di calcio."},"Howea forsteriana (kentia)":{f:"Arecaceae",o:"Madagascar, endemica",h:"Cresce lungo i corsi d'acqua, con le radici quasi sempre umide.",c:"In natura arriva a dodici metri, e in Madagascar \xE8 minacciata: ne restano poche popolazioni selvatiche. Quella che compri nei supermercati \xE8 tutta da coltivazione.",t:"Non tossica."},"Epipremnum aureum (pothos)":{f:"Araceae",o:"Moorea, Polinesia francese",h:"Rampicante che in natura sale sugli alberi fino a venti metri.",c:"Le foglie che conosci sono giovanili: se lasciata salire su un tronco produce foglie da un metro, fenestrate come una monstera. \xC8 anche una specie invasiva grave in molte zone tropicali.",t:"Tossica: ossalati di calcio."},"Spathiphyllum (spatifillo)":{f:"Araceae",o:"America centrale e Colombia",h:"Sottobosco umido di foresta pluviale.",c:"Il fiore non \xE8 il fiore: la parte bianca \xE8 una brattea, e i fiori veri sono i puntini sulla pannocchia centrale. Fiorisce solo con abbastanza luce, quindi in penombra resta verde per anni.",t:"Tossica: ossalati di calcio."},"Maranta leuconeura":{f:"Marantaceae",o:"Foresta pluviale brasiliana",h:"Tappezzante di sottobosco, in ombra profonda.",c:"Di notte alza le foglie e le chiude come mani giunte: si chiama nictinastia ed \xE8 un movimento vero, guidato da cuscinetti d'acqua alla base del picciolo. Da l\xEC il nome di pianta della preghiera.",t:"Non tossica."},Calathea:{f:"Marantaceae",o:"America tropicale",h:"Sottobosco umido, all'ombra di alberi alti.",c:"Nel 2012 gran parte delle calathee \xE8 stata riclassificata nel genere Goeppertia: quello che compri come Calathea spesso ha gi\xE0 un altro nome scientifico.",t:"Non tossica."},"Fittonia albivenis":{f:"Acanthaceae",o:"Per\xF9 e bacino amazzonico",h:"Tappeto del sottobosco, in ombra e umidit\xE0 costante.",c:"Il reticolo bianco sono le nervature: albivenis vuol dire proprio vene bianche. Il crollo teatrale quando ha sete \xE8 un meccanismo di risparmio idrico, non un danno.",t:"Non tossica."},"Chlorophytum (spider plant)":{f:"Asparagaceae",o:"Africa australe",h:"Sottobosco e zone rocciose, con radici tuberose che immagazzinano acqua.",c:"Fa figli su stoloni lunghi anche un metro: \xE8 una delle poche piante d'appartamento che si clona da sola. Ed \xE8 tra le pochissime del tutto sicure per i gatti.",t:"Non tossica."},"Sansevieria (snake plant)":{f:"Asparagaceae",o:"Africa occidentale tropicale",h:"Zone aride e rocciose, in pieno sole o mezz'ombra.",c:"Dal 2017 il genere Sansevieria \xE8 stato assorbito in Dracaena. Fa fotosintesi CAM: apre gli stomi di notte per perdere meno acqua, come i cactus.",t:"Lievemente tossica se ingerita."},"Sansevieria intrecciata":{f:"Asparagaceae",o:"Africa occidentale tropicale",h:"Come la specie: l'intreccio \xE8 lavorazione da vivaio.",c:"Le foglie sono state legate da giovani e sono cresciute cos\xEC. Nel punto d'incrocio l'acqua ristagna, ed \xE8 l\xEC che comincia il marciume.",t:"Lievemente tossica se ingerita."},"Peperomia polybotrya (raindrop)":{f:"Piperaceae",o:"Per\xF9 e Colombia",h:"Epifita e rupicola, spesso su rocce coperte di muschio.",c:"Parente stretta del pepe nero. Le foglie carnose sono una riserva d'acqua: per questo tollera di essere dimenticata e non tollera il terriccio zuppo.",t:"Non tossica."},"Peperomia obtusifolia":{f:"Piperaceae",o:"Florida, Caraibi e Sud America",h:"Epifita nelle foreste umide, su tronchi e ceppaie.",c:"Si moltiplica da una sola foglia con un pezzo di picciolo: una delle propagazioni pi\xF9 facili che esistano.",t:"Non tossica."},"Phlebodium aureum (felce blu)":{f:"Polypodiaceae",o:"America tropicale e subtropicale",h:"Epifita: vive sui tronchi e alla base delle palme, mai nella terra.",c:"Il rizoma \xE8 coperto di squame dorate, da cui aureum. La sfumatura azzurra viene da una cera superficiale che riflette la luce: se strofini le foglie va via e non torna.",t:"Non tossica."},"Felce rustica da esterno":{f:"Dryopteridaceae",o:"Boschi temperati dell'emisfero nord",h:"Sottobosco fresco e ombroso, su terreni ricchi di foglie decomposte.",c:"Le felci non hanno n\xE9 fiori n\xE9 semi: si riproducono con spore, e sulla pagina inferiore delle fronde vedrai i sori, i puntini scuri che le contengono.",t:"Non tossica per contatto."},"Hedera helix (edera)":{f:"Araliaceae",o:"Europa e Asia occidentale",h:"Rampicante di bosco, si arrampica con radichette avventizie.",c:"Ha due forme distinte: da giovane rampicante con foglie a lobi, da adulta arbustiva con foglie intere, e solo in quella forma fiorisce. Le talee mantengono la forma da cui provengono.",t:"Tossica: bacche e foglie contengono saponine."},"Pilea peperomioides":{f:"Urticaceae",o:"Yunnan, Cina sud-occidentale",h:"Rupicola: cresce su rocce ombrose ai piedi dell'Himalaya.",c:"Per decenni \xE8 stata quasi sconosciuta ai botanici occidentali: si \xE8 diffusa in Europa dagli anni Quaranta passando di mano in mano come talea, portata da un missionario norvegese, prima ancora di essere identificata con certezza.",t:"Non tossica."},"Hypoestes (polka dot)":{f:"Acanthaceae",o:"Madagascar",h:"Sottobosco umido.",c:"Le macchie rosa sono aree prive di clorofilla: pi\xF9 luce riceve, pi\xF9 il disegno \xE8 marcato. In ombra sbiadisce e la pianta si allunga.",t:"Non tossica."},"Sedum nussbaumerianum":{f:"Crassulaceae",o:"Veracruz, Messico",h:"Scarpate rocciose assolate, con pochissimo suolo.",c:"Le foglie virano al rame per proteggersi dall'eccesso di luce: \xE8 un pigmento protettivo, quindi il colore che ti piace \xE8 letteralmente una scottatura controllata. La patina bianca sopra \xE8 cera, e una volta tolta con le dita non ricresce su quella foglia.",t:"Non tossica."},Philodendron:{f:"Araceae",o:"America tropicale",h:"Rampicanti ed emiemifite di foresta pluviale.",c:"\xC8 il secondo genere pi\xF9 numeroso delle Araceae: quasi cinquecento specie descritte, e molte ancora no.",t:"Tossica: ossalati di calcio."}},Ih=["deliciosa","adansonii","adansonii-solo","pothos","pothos-acqua","alocasia","polly","anthurium-regale","anthurium-serra","spatifillo","maranta","calathea","fittonia","p lants watered on the same day","Giornata piena":"A full day","Acqua, concime, una cura e una foglia nuova nello stesso giorno":"Water, feed, a treatment and a new leaf on the same day",Tripletta:"Hat-trick","Tre foglie nuove nello stesso giorno":"Three new leaves on the same day","Sei mesi insieme":"Six months together","Sei mesi dalla prima registrazione":"Six months since your first record","Un anno verde":"A green year","Un anno intero di registrazioni":"A full year of records","Vecchia amica":"Old friend","Cinquanta annaffiature sulla stessa pianta":"Fifty waterings on the same plant","Nessuno indietro":"Nobody left behind","Almeno dieci piante e nemmeno una in ritardo":"At least ten plants and not one overdue",Esploratore:"Explorer","Aver visitato Storico, Terricci e il profilo":"You visited History, Soil mixes and the profile","Passato l'inverno":"Winter survived","Registrazioni sia a dicembre che a marzo: hai attraversato la stagione difficile":"Records in both December and March: you got through the hard season","Rinvaso puntuale":"Well-timed repot","Un rinvaso fatto tra marzo e maggio, il periodo ideale":"A repot done between March and May, the ideal window","Notte e giorno":"Night and day","Aver provato sia il tema chiaro che quello scuro":"You tried both the light and the dark theme","Quattro in una":"Four in one","Pi\xF9 piante nello stesso vaso, contate come una":"Several plants in one pot, counted as one","Questa settimana non hai saltato niente.":"You haven't missed a thing this week.","C'\xE8 aria di crescita, in casa.":"There's growth in the air at home.","Va tutto liscio, non c'\xE8 niente da fare.":"All smooth, nothing to do.","Nessuna in ritardo: puoi respirare.":"None overdue: you can breathe.","Ne manca una sola, poi sei a posto.":"Just one left, then you're done.","scorri a destra per annaffiare":"swipe right to water","a sinistra per aprire la scheda":"swipe left to open the details","Nessuna pianta da annaffiare oggi.":"No plants to water today.","Nessuna pianta da tenere d'occhio.":"No plants to keep an eye on.","Puoi anche non aprire l'app fino a domani.":"You needn't open the app again until tomorrow.","Vuol dire che stanno tutte abbastanza bene.":"It means they're all doing well enough.","Prova col nome, la specie o la stanza.":"Try the name, the species or the room.","Vedile tutte":"See them all","Quanto \xE8 grande":"How big it is",Giovane:"Young",Adulta:"Adult",Matura:"Mature","mostra quelli da sbloccare":"show the locked ones","nascondi quelli da sbloccare":"hide the locked ones","Il mese scorso":"Last month","\xE8 stata la migliore con":"was the best with","Nessuna foglia nuova segnata nel mese.":"No new leaves recorded this month.","Da guardare da vicino:":"Worth a closer look:","In ritardo adesso:":"Overdue right now:","Met\xE0 dei danni alle piante d'appartamento nasce dal fare qualcosa, non dal dimenticarsene. Queste stanno bene cos\xEC come sono.":"Half the damage done to houseplants comes from doing something, not from forgetting. These are fine exactly as they are.","Sulle foglie":"On the leaves","Sul terriccio":"On the soil","Sul fusto o alla base":"On the stem or base","Nella crescita":"In how it grows","Vedo insetti":"I see insects",Ingialliscono:"Yellowing","Punte e bordi marroni e croccanti":"Brown crispy tips and edges","Macchie brune con alone giallo":"Brown spots with a yellow halo","Macchie chiare o sbiancate":"Pale or bleached patches","Patina bianca polverosa":"White powdery film","Aree argentate e foglie deformi":"Silvery patches and deformed leaves","Afflosciate di colpo":"Suddenly collapsed","Arricciate verso l'interno":"Curling inwards","Appiccicose al tatto":"Sticky to the touch","Muffa bianca soffice in superficie":"Soft white mould on top","Crosta bianca dura sul bordo":"Hard white crust on the rim","Resta bagnato per giorni":"Stays wet for days","L'acqua scorre via subito":"Water runs straight through","Moscerini che volano via":"Small flies taking off","Base molle e scura":"Soft dark base","Batuffoli bianchi cotonosi":"White cottony tufts","Crosticine marroni attaccate":"Brown scabs stuck on","Steli lunghi e foglie distanti":"Long stems, widely spaced leaves","Foglie nuove piccole e pallide":"Small pale new leaves","Ferma da mesi":"Stalled for months","Ragnatele finissime e puntini mobili":"Fine webbing and moving dots","Scudetti marroni immobili":"Motionless brown scales","Moscerini attorno al vaso":"Flies around the pot","Insetti minuscoli e velocissimi":"Tiny very fast insects","Come \xE8 il terriccio adesso?":"How is the soil right now?","Bagnato o umido":"Wet or damp",Asciutto:"Dry",Bagnato:"Wet","Da quanto non la rinvasi?":"How long since you repotted it?","Pi\xF9 di due anni o non lo so":"More than two years, or I don't know","Di recente":"Recently","Dove hai notato il problema?":"Where did you notice it?","che aspetto ha?":"what does it look like?","Ecco le cause pi\xF9 probabili, in ordine.":"Here are the most likely causes, in order.","Apro l'elenco\u2026":"Opening your plants\u2026","Nessuna foglia nuova segnata":"No new leaves recorded","Da assegnare":"Unassigned","Non tossica.":"Not toxic."},Bh=(e,t)=>t==="en"?_h[e]??e:e,Oh={"marciume-radici":{s:"Yellow leaves and soil still wet",c:"Root rot: drowned roots stop absorbing, so the plant yellows as if it were thirsty. It's the commonest trap, and watering more finishes it off.",f:["Slide the root ball out and look: white firm roots are fine, brown mushy ones are rotten.","Cut away everything rotten with clean scissors, repot into dry, sharper-draining mix.","Don't water for a week and don't feed for a month."]},"marciume-colletto":{s:"Base of the stem soft, dark, giving way",c:"Crown rot: it starts where the stem meets the soil, usually because water sits there or has run into the centre of the rosette.",f:["On snake plants and succulents it's almost always fatal below that point: cut above the rot and root the healthy part.","Water from below or along the rim of the pot, never into the middle."]},"substrato-bagnato":{s:"The soil stays wet for more than a week",c:"Compacted mix or an oversized pot: soil with no roots in it just holds water.",f:["Repot into a pot only 2-4 cm wider, with more perlite or bark.","Check the drainage hole isn't blocked by roots."]},sete:{s:"Leaves suddenly collapsed, soil dry",c:"Just thirst. Some species faint dramatically and stand back up within the hour.",f:["Water well and wait: if it recovers, that was it.","If it happens often, shorten the interval: every collapse costs a few root hairs."]},idrorepellente:{s:"Water runs straight through and the pot stays light",c:"The root ball dried out too far: it turns water-repellent and the water slides down the sides without wetting anything.",f:["Stand the pot in a basin for ten minutes, then drain well.","Always true for bark-based mixes, the hardest of all to re-wet."]},ragnetto:{s:"Very fine webbing between leaves, moving dots",c:"Spider mites. They love dry warmth and start on the lower leaves, underneath. The pest that kills the most alocasias.",f:["Shower with lukewarm water on the undersides, thoroughly.","Start a neem cycle: three passes seven days apart, in the evening.","Raise the humidity: in dry air they breed within days."]},"cocciniglia-farinosa":{s:"White cottony tufts where leaf meets stem",c:"Mealybugs. They hide in leaf axils and under the pot rim, and move between plants that touch.",f:["Remove them one by one with a cotton bud dipped in alcohol.","Then neem over the whole plant, and isolate it until it's clean.","Check the soil too: some species live on the roots."]},"cocciniglia-bruna":{s:"Brown scales stuck on the stalks, sticky leaves",c:"Brown scale. They look like little scabs and don't move: the stickiness is their honeydew, on which black sooty mould then grows.",f:["Scrape them off with a fingernail or a soft toothbrush.","Wash the leaves with water and a few drops of mild soap, then rinse.","Repeat after ten days: the eggs under the scale survive."]},sciaridi:{s:"Small flies rising from the pot when you move it",c:"Fungus gnats. The adults are harmless, the larvae eat root hairs and only live in constantly damp compost.",f:["Let the top 3 cm dry out: without surface moisture the cycle breaks.","A layer of grit or sand on top stops them laying.","Yellow sticky traps catch adults but don't solve it alone."]},tripidi:{s:"Silvery patches with black dots, new leaves deformed",c:"Thrips. Tiny and fast, they damage leaves while still furled: you see the damage once it's done.",f:["Neem repeated every seven days for at least three cycles.","Cut the worst leaves: they don't heal.","The most stubborn of all: expect a month of work."]},"macchie-fungine":{s:"Brown spots with a yellow halo",c:"Fungal or bacterial leaf spot. Almost always starts from wet leaves left damp overnight.",f:["Cut off affected leaves and bin them, not the compost.","Don't mist in the evening: leaves must dry before dark.","Improve airflow between plants."]},oidio:{s:"White powdery film on the leaves",c:"Powdery mildew. It comes with still air and temperature swings, more than with humidity.",f:["Wipe the leaves with a damp cloth and isolate the plant.","Bicarbonate in water, or wettable sulphur, on affected parts.","Space the plants out: still air is the main cause."]},"muffa-terriccio":{s:"Soft white mould on the surface of the soil",c:"Almost always harmless: saprophytic fungi eating organic matter. It does tell you that mix stays too wet.",f:["Scrape off the top layer and let it dry more.","No treatment needed: it goes when the surface dries."]},sali:{s:"White crust on the soil or the pot rim",c:"Salt build-up, from over-feeding or hard water. Salts pull water back out of the roots and burn them.",f:["Flush it: plenty of water running out of the hole, three or four times over.","Stop feeding for two months.","If your water is hard, switch to distilled."]},carenza:{s:"New leaves small and pale, growth stalled in season",c:"Nutrient shortage: exhausted mix, or never fed. It happens sooner in bark-based mixes, which hold little.",f:["Resume feeding at half strength and watch the next leaf.","If nothing changes in two months, the problem is light or roots, not food."]},"punte-secche":{s:"Brown, crispy tips and edges",c:"Dry air, limescale in the water, or both. The most misread symptom there is: it looks like thirst and isn't.",f:["Switch to distilled or rainwater.","Group the plants together and move them away from radiators.","Tips already brown won't turn green again: trim following the leaf outline."]},arricciate:{s:"Leaves curling inwards",c:"The plant is reducing its exposed surface to lose less water: air too dry, or roots unable to absorb.",f:["Check the soil first: if it's wet, the problem is the roots, not the air.","If it's dry and the air is dry, raise humidity by grouping plants."]},filatura:{s:"Long bare stems, small widely spaced leaves",c:"Etiolation: the plant is stretching towards light. The most reliable sign of a wrong spot.",f:["Move it closer to a window, gradually.","Prune the stretched stems: it will regrow more compact.","On variegated plants, low light also turns the pale parts green again."]},scottatura:{s:"Pale, bleached or dry patches in the middle of the leaf",c:"Sunburn from direct sun, often through glass that concentrates the heat.",f:["Move the plant or screen it with a light curtain.","Burnt areas don't heal: only remove the leaf if more than half is gone."]}},Uh={"Monstera deliciosa":{f:"Araceae",o:"Southern Mexico and Panama",h:"Hemiepiphyte: it germinates on the ground, finds a trunk and climbs it with aerial roots, eventually losing contact with the soil.",c:"The holes aren't decoration: they let wind and light through to the leaves below in the understorey. They only appear with maturity, and the ripe fruit is the one edible part of the plant.",t:"Toxic: the whole plant contains calcium oxalate, which burns mouth and throat."},"Monstera adansonii":{f:"Araceae",o:"Central and South America",h:"Understorey climber, going up trunks in partial shade.",c:"The fenestrations are there from a young age, unlike deliciosa. In the wild it covers entire trunks.",t:"Toxic: calcium oxalate."},"Monstera adansonii Mint (variegata)":{f:"Araceae",o:"Horticultural selection",h:"Like the species, but with pale green leaf sectors rather than white ones.",c:"Mint differs from white variegation: the pale sectors still contain chlorophyll, so they work. It grows faster, burns far less in sun, and the variegation is much more stable \u2014 it rarely reverts.",t:"Toxic: calcium oxalate."},Alocasia:{f:"Araceae",o:"South-east Asia and eastern Australia",h:"Humid tropical understorey, from a rhizome or tuber.",c:"In winter it can drop every leaf and go dormant: it looks dead but the tuber is alive and shoots again in March. Thousands end up in the bin every year for this reason.",t:"Toxic: calcium oxalate, among the most irritating of the group."},"Alocasia amazonica (Polly)":{f:"Araceae",o:"None: it's a nursery hybrid",h:"A horticultural cross; it doesn't exist in the wild.",c:"The name misleads: nothing to do with the Amazon. It comes from the Amazon Nursery in Florida, where the hybrid was created in the 1950s.",t:"Toxic: calcium oxalate."},"Anthurium regale":{f:"Araceae",o:"Peru",h:"Epiphyte: it grows clinging to trunks, roots in the air.",c:"Velvet leaves reach a metre in the wild. That velvet comes from dome-shaped epidermal cells that capture the scarce understorey light \u2014 and it's also why a single water droplet leaves a permanent mark.",t:"Toxic: calcium oxalate."},"Anthurium warocqueanum":{f:"Araceae",o:"Colombia",h:"Cloud-forest epiphyte, between 200 and 1500 metres.",c:"They call it the queen anthurium: the hanging leaves pass a metre and a half. It grows very slowly and wants humidity that doesn't exist indoors, which is why it's one of the hardest plants in the trade.",t:"Toxic: calcium oxalate."},"Howea forsteriana (kentia)":{f:"Arecaceae",o:"Lord Howe Island, Australia \u2014 endemic",h:"Subtropical forest understorey: it grows in the shade of taller trees, not in full sun.",c:"All of them come from an eleven-square-kilometre island in the Pacific, where seed collection and export are regulated by law and are the main local industry. It's the Victorian parlour palm precisely because it takes low light and dry air better than any other.",t:"Not toxic."},"Epipremnum aureum (pothos)":{f:"Araceae",o:"Moorea, French Polynesia",h:"A climber that goes twenty metres up trees in the wild.",c:"The leaves you know are juvenile: let it climb a trunk and it makes metre-long fenestrated leaves like a monstera. It's also a serious invasive species across the tropics.",t:"Toxic: calcium oxalate."},"Spathiphyllum (spatifillo)":{f:"Araceae",o:"Central America and Colombia",h:"Humid rainforest understorey.",c:"The flower isn't the flower: the white part is a bract, and the real flowers are the dots on the central spike. It only blooms with enough light, so in shade it stays green for years.",t:"Toxic: calcium oxalate."},"Maranta leuconeura":{f:"Marantaceae",o:"Brazilian rainforest",h:"Understorey ground cover, in deep shade.",c:"At night it raises its leaves and folds them like praying hands: it's called nyctinasty, a real movement driven by water cushions at the base of each stalk. Hence the name prayer plant.",t:"Not toxic."},Calathea:{f:"Marantaceae",o:"Tropical America",h:"Humid understorey, shaded by taller trees.",c:"In 2012 most calatheas were reclassified into the genus Goeppertia: what you buy as Calathea often already has another scientific name.",t:"Not toxic."},"Fittonia albivenis":{f:"Acanthaceae",o:"Peru and the Amazon basin",h:"Forest-floor carpet, in shade and constant humidity.",c:"The white net is the veins: albivenis literally means white-veined. The theatrical collapse when thirsty is a water-saving mechanism, not damage.",t:"Not toxic."},"Chlorophytum (spider plant)":{f:"Asparagaceae",o:"Southern Africa",h:"Understorey and rocky ground, with tuberous roots that store water.",c:"It makes babies on runners up to a metre long: one of the few houseplants that clones itself. And one of the very few completely safe around cats.",t:"Not toxic."},"Sansevieria (snake plant)":{f:"Asparagaceae",o:"Tropical West Africa",h:"Arid, rocky ground, in full sun or partial shade.",c:"Since 2017 the genus Sansevieria has been absorbed into Dracaena. It runs CAM photosynthesis: stomata open at night to lose less water, like cacti.",t:"Mildly toxic if eaten."},"Sansevieria intrecciata":{f:"Asparagaceae",o:"Tropical West Africa",h:"As the species: the braid is nursery work.",c:"The leaves were tied young and grew that way. Water pools where they cross, and that's where rot starts.",t:"Mildly toxic if eaten."},"Peperomia polybotrya (raindrop)":{f:"Piperaceae",o:"Peru and Colombia",h:"Epiphytic and rock-dwelling, often on moss-covered stone.",c:"A close relative of black pepper. The fleshy leaves are a water store: that's why it tolerates being forgotten and won't tolerate soggy soil.",t:"Not toxic."},"Peperomia obtusifolia":{f:"Piperaceae",o:"Florida, the Caribbean and South America",h:"Epiphytic in humid forest, on trunks and stumps.",c:"It propagates from a single leaf with a piece of stalk: one of the easiest propagations there is.",t:"Not toxic."},"Phlebodium aureum (felce blu)":{f:"Polypodiaceae",o:"Tropical and subtropical America",h:"Epiphyte: it lives on trunks and at the base of palms, never in soil.",c:"The rhizome is covered in golden scales, hence aureum. The blue cast comes from a surface wax that reflects light: rub the leaves and it goes, permanently.",t:"Not toxic."},"Felce rustica da esterno":{f:"Dryopteridaceae",o:"Temperate woodland of the northern hemisphere",h:"Cool shaded understorey, on soil rich in leaf litter.",c:"Ferns have neither flowers nor seeds: they reproduce by spores, and on the underside of the fronds you'll see the sori, the dark dots that hold them.",t:"Not toxic to the touch."},"Hedera helix (edera)":{f:"Araliaceae",o:"Europe and western Asia",h:"Woodland climber, gripping with adventitious rootlets.",c:"It has two distinct forms: juvenile and climbing with lobed leaves, adult and shrubby with entire leaves, and only the adult form flowers. Cuttings keep whichever form they came from.",t:"Toxic: berries and leaves contain saponins."},"Pilea peperomioides":{f:"Urticaceae",o:"Yunnan, south-west China",h:"Rock-dweller: it grows on shaded rock at the foot of the Himalayas.",c:"For decades it was nearly unknown to Western botanists: it spread through Europe from the 1940s hand to hand as cuttings, carried by a Norwegian missionary, before it had been firmly identified.",t:"Not toxic."},"Hypoestes (polka dot)":{f:"Acanthaceae",o:"Madagascar",h:"Humid understorey.",c:"The pink patches are areas without chlorophyll: the more light it gets, the stronger the pattern. In shade it fades and the plant stretches.",t:"Not toxic."},"Sedum nussbaumerianum":{f:"Crassulaceae",o:"Veracruz, Mexico",h:"Sunny rocky slopes, with almost no soil.",c:"The leaves turn copper to protect themselves from excess light: it's a protective pigment, so the colour you like is literally a controlled sunburn. The white bloom on top is wax, and once rubbed off with your fingers it never returns on that leaf.",t:"Not toxic."},Philodendron:{f:"Araceae",o:"Tropical America",h:"Climbers and hemiepiphytes of the rainforest.",c:"The second largest genus in the Araceae: nearly five hundred described species, and many still not.",t:"Toxic: calcium oxalate."}},Hs={"aroidee-epifite":{titolo:"Epiphytic aroids",parti:["50% fine pine bark","20% perlite","20% sphagnum","10% charcoal"],perche:"Aerial roots evolved to grip tree bark: they want air between them, not soil. Standard potting compost here is the most common reason a plant stalls."},"aroidee-terrestri":{titolo:"Ground aroids",parti:["40% potting compost","30% fine bark","20% perlite","10% lava rock or charcoal"],perche:"Rich but loose: the bark creates air pockets, the perlite stops it compacting."},marantacee:{titolo:"Prayer plants",parti:["50% coco coir or peat","30% perlite","20% fine bark"],perche:"Acidic mix that stays damp without turning to mud. It must never dry out completely, nor stay waterlogged."},peperomie:{titolo:"Peperomias",parti:["40% potting compost","40% perlite or pumice","20% fine bark"],perche:"Fleshy leaves hold their own water: the roots need to dry fast. Being pot-bound suits them."},sansevierie:{titolo:"Snake plants",parti:["60% cactus compost","40% pumice or lava rock"],perche:"The sharpest-draining mix of all. If it stays damp for more than a few days the rhizome rots from below with no warning."},palme:{titolo:"Palms",parti:["60% potting compost","20% pumice or coarse sand","20% bark"],perche:"Must hold moisture deep down without compacting: the only one here that dislikes drying out completely."},felci:{titolo:"Ferns",parti:["50% potting compost","30% coco coir","20% perlite"],perche:"Damp and light. The roots are fine and shallow: a heavy mix suffocates them quickly."},"felci-epifite":{titolo:"Epiphytic ferns",parti:["40% fine bark","30% coco coir","20% perlite","10% sphagnum"],perche:"Phlebodium grows on trunks, not in soil: the furry rhizome must sit on the surface, never buried, or it rots."},grasse:{titolo:"Succulents",parti:["50% cactus compost","30% pumice or lava rock","20% coarse sand"],perche:"It has to dry in two or three days. Rosettes rot at the collar, so a top layer of grit keeps the leaves off the wet."},facili:{titolo:"General houseplant",parti:["70% potting compost","30% perlite"],perche:"For the plants that don't make a fuss. The perlite still matters: compost alone compacts within months."},acqua:{titolo:"Still in water",parti:["No mix for now"],perche:"Once roots reach 4-5 cm, first pot into a small container with the right mix for the species. The longer you wait, the worse they adapt."}},Wh={rubinetto:{t:"Tap water",costo:"free",come:"Straight from the tap.",risolve:"Fine for most houseplants.",problema:"In hard-water areas it leaves limescale and slowly raises the pH of the soil."},riposata:{t:"Left to stand overnight",costo:"free",come:"Fill an open jug and leave it out for 12-24 hours.",risolve:"Chlorine evaporates and the water reaches room temperature, avoiding root shock.",problema:"It does not remove limescale, and if your supplier uses chloramine that doesn't evaporate either."},demi:{t:"Distilled",costo:"about \u20AC1 for 5 litres",come:"Supermarket, in the iron and steam-cleaner aisle. Look for pure distilled water with no perfume or additives, which damage roots.",risolve:"No limescale and no salts. The simplest and cheapest answer there is.",problema:"Being mineral-free, the plant depends entirely on fertiliser: don't skip it."},piovana:{t:"Rainwater",costo:"free",come:"A bucket on the balcony. Discard the first few minutes, which wash dust out of the air, and store it in the dark or it turns green within a week.",risolve:"The best water there is: slightly acidic, limescale-free, with a few useful minerals.",problema:"Not available all year, and not to be used if it runs off a treated gutter or a bitumen roof."},condensa:{t:"Dehumidifier condensate",costo:"free",come:"The water in the tank of a dehumidifier or air conditioner.",risolve:"Essentially distilled: no limescale at all. The cheapest way to get pure water without buying it.",problema:"Only if the unit is clean: bacteria build up in dirty filters. Never on edible plants."},osmosi:{t:"Reverse osmosis",costo:"\u20AC150-400 for the system",come:"An under-sink filter that pushes water through a very fine membrane which holds back almost everything.",risolve:"Water as pure as distilled, straight from the tap and without buying bottles.",problema:"Costly, needs installing, and wastes two or three litres for every good one. Only worth it if you drink it too."},caraffa:{t:"Filter jug",costo:"\u20AC30 plus cartridges",come:"The classic fridge jug.",risolve:"Lowers hardness a little and removes chlorine.",problema:"It does not demineralise: it only partly reduces limescale, and its capacity fades as the cartridge ages."},bollita:{t:"Boiled",costo:"free",come:"Boil it, let it cool and use only the top part.",risolve:"Some of the limescale, the carbonate part, settles at the bottom.",problema:"The other salts stay and actually concentrate, because some water evaporates. The remedy that sounds clever and works least."}},ua={"Monstera deliciosa":{giorni:8,concime:21,miscela:"aroidee-terrestri",rinvaso:24,sostegno:"palo-cocco",spray:!0,pulizia:!0,rotazione:!0,tipoAcqua:"rubinetto",metodo:"A pioggia lenta finch\xE9 esce dal foro, poi svuota il sottovaso.",consiglio:"Luce indiretta forte: vicino a una finestra, mai sul davanzale al sole."},"Monstera adansonii":{giorni:7,concime:21,miscela:"aroidee-terrestri",rinvaso:18,sostegno:"palo-cocco",spray:!0,pulizia:!0,rotazione:!0,tipoAcqua:"rubinetto",metodo:"Bagna anche il palo di cocco, non solo il terriccio.",consiglio:"Luce indiretta forte, mai sole diretto."},"Monstera adansonii Mint (variegata)":{giorni:9,concime:24,miscela:"aroidee-terrestri",rinvaso:18,sostegno:"palo-cocco",spray:!0,pulizia:!0,rotazione:!0,tipoAcqua:"rubinetto",metodo:"Bagna anche il palo. La variegatura mint fa fotosintesi, quindi beve pi\xF9 di una variegata bianca.",consiglio:"Luce indiretta forte: i settori chiari lavorano, ma il sole pieno li brucerebbe."},Alocasia:{giorni:7,concime:21,miscela:"aroidee-terrestri",rinvaso:12,rotazione:!0,spray:!0,pulizia:!0,tipoAcqua:"rubinetto",metodo:"Abbondante fino al drenaggio, poi lascia asciugare i primi 3 cm.",consiglio:"Luce forte e aria umida. Controlla il rovescio delle foglie: il ragnetto rosso \xE8 il suo nemico."},"Alocasia amazonica (Polly)":{giorni:6,concime:21,miscela:"aroidee-terrestri",rinvaso:12,rotazione:!0,spray:!0,pulizia:!0,tipoAcqua:"rubinetto",metodo:"Abbondante fino al drenaggio, poi svuota il sottovaso: non deve restare a mollo.",consiglio:"Luce indiretta forte e umidit\xE0 alta, lontano da spifferi e termosifoni."},"Anthurium regale":{giorni:6,concime:14,miscela:"aroidee-epifite",rinvaso:12,radicante:!0,rotazione:!0,tipoAcqua:"demineralizzata",metodo:"Immersione: la corteccia respinge l'acqua versata dall'alto. Mai sulle foglie.",consiglio:"Vuole il 70% di umidit\xE0: il bagno \xE8 l'unica stanza normale che ci arriva."},"Anthurium warocqueanum":{giorni:5,concime:14,miscela:"aroidee-epifite",rinvaso:12,radicante:!0,tipoAcqua:"demineralizzata",metodo:"Nebulizza lo sfagno finch\xE9 \xE8 umido, mai fradicio.",consiglio:"Umidit\xE0 altissima: da piccola vive meglio in una serretta."},"Howea forsteriana (kentia)":{giorni:9,concime:30,miscela:"palme",rinvaso:36,rotazione:!0,spray:!0,pulizia:!0,tipoAcqua:"riposata una notte",metodo:"Abbondante fino al drenaggio, poi lascia asciugare i primi 3-4 cm.",consiglio:"Tollera la luce scarsa meglio di quasi tutte, purch\xE9 senza sole diretto."},"Epipremnum aureum (pothos)":{giorni:8,concime:21,miscela:"facili",rinvaso:18,sostegno:"palo-cocco",spray:!0,pulizia:!0,rotazione:!0,tipoAcqua:"rubinetto",metodo:"A pioggia fino al drenaggio, poi svuota il sottovaso.",consiglio:"In luce forte tiene la variegatura, in penombra torna verde."},"Spathiphyllum (spatifillo)":{giorni:5,concime:21,miscela:"aroidee-terrestri",rinvaso:18,rotazione:!0,spray:!0,pulizia:!0,tipoAcqua:"riposata una notte",metodo:"Abbondante fino al drenaggio. Non aspettare che si affloscia.",consiglio:"Sopravvive in penombra, ma per fiorire servono due ore di luce indiretta forte."},"Maranta leuconeura":{giorni:4,concime:21,miscela:"marantacee",rinvaso:18,rotazione:!0,spray:!0,tipoAcqua:"demineralizzata",metodo:"Immersione dal basso, terriccio sempre appena umido.",consiglio:"Umidit\xE0 alta e luce indiretta: il bagno \xE8 il posto naturale."},Calathea:{giorni:5,concime:21,miscela:"marantacee",rinvaso:18,rotazione:!0,spray:!0,tipoAcqua:"demineralizzata",metodo:"Immersione dal basso. Le punte secche vengono dal calcare, non dalla sete.",consiglio:"Umidit\xE0 alta, luce indiretta bassa, acqua senza calcare."},"Fittonia albivenis":{giorni:3,concime:21,miscela:"felci",rinvaso:15,rotazione:!0,spray:!0,tipoAcqua:"demineralizzata",metodo:"Dal basso e poca alla volta: il terriccio deve restare appena umido, sempre.",consiglio:"Umidit\xE0 alta e luce indiretta bassa: sta bene accanto alle marantacee."},"Chlorophytum (spider plant)":{giorni:6,concime:30,miscela:"facili",rinvaso:12,rotazione:!0,spray:!0,pulizia:!0,tipoAcqua:"demineralizzata",metodo:"Abbondante fino al drenaggio, poi scola tutto.",consiglio:"Vuole luce brillante, non umidit\xE0: non \xE8 una pianta da bagno buio."},"Sansevieria (snake plant)":{giorni:21,concime:60,miscela:"sansevierie",rinvaso:36,tipoAcqua:"rubinetto",metodo:"Abbondante ma rarissimo, e mai nel cuore della rosetta.",consiglio:"Indifferente alla luce scarsa. L'unico modo per ucciderla \xE8 annaffiarla troppo."},"Sansevieria intrecciata":{giorni:21,concime:60,miscela:"sansevierie",rinvaso:36,tipoAcqua:"rubinetto",metodo:"Dal basso, cos\xEC non ristagna dove le foglie si incrociano.",consiglio:"Come la sansevieria normale, ma guarda il punto d'incrocio: \xE8 l\xEC che marcisce."},"Peperomia polybotrya (raindrop)":{giorni:13,concime:45,miscela:"peperomie",rinvaso:30,rotazione:!0,tipoAcqua:"rubinetto",metodo:"Immersione dal basso, poi scola bene. Foglie asciutte.",consiglio:"Luce indiretta. Stretta nel vaso va benissimo."},"Peperomia obtusifolia":{giorni:12,concime:45,miscela:"peperomie",rinvaso:30,rotazione:!0,tipoAcqua:"rubinetto",metodo:"Poca ma regolare, dal basso. Gli sbalzi le fanno cadere le foglie.",consiglio:"Luce indiretta, lontano da correnti e sbalzi di temperatura."},"Phlebodium aureum (felce blu)":{giorni:6,concime:30,miscela:"felci-epifite",rinvaso:24,rotazione:!0,spray:!0,tipoAcqua:"demineralizzata",metodo:"Bagna il substrato senza mai coprire il rizoma in superficie.",consiglio:"Epifita: il rizoma peloso deve restare in superficie, mai interrato."},Felce:{giorni:4,concime:30,miscela:"felci",rinvaso:18,rotazione:!0,spray:!0,tipoAcqua:"demineralizzata",metodo:"Poca alla volta, ma il terriccio non deve mai asciugare del tutto.",consiglio:"Vuole aria umida pi\xF9 che terra bagnata."},"Felce rustica da esterno":{giorni:4,concime:30,miscela:"felci",rinvaso:24,tipoAcqua:"piovana",metodo:"Solo se il terriccio \xE8 asciutto in profondit\xE0: fuori ci pensa spesso la pioggia.",consiglio:"Mezz'ombra all'aperto, riparata dal sole delle ore centrali e dal vento."},"Hedera helix (edera)":{giorni:6,concime:30,miscela:"facili",rinvaso:18,sostegno:"traliccio",spray:!0,tipoAcqua:"riposata una notte",metodo:"Regolare, senza mai lasciare il vaso a mollo.",consiglio:"Fresco e luminoso. Si aggrappa solo a superfici ruvide: legno, corda, cocco."},"Pilea peperomioides":{giorni:8,concime:28,miscela:"facili",rinvaso:18,rotazione:!0,tipoAcqua:"rubinetto",metodo:"Abbondante fino al drenaggio, poi lascia asciugare i primi centimetri.",consiglio:"Luce indiretta brillante, e ruotala ogni settimana o cresce storta."},"Hypoestes (polka dot)":{giorni:3,concime:21,miscela:"facili",rinvaso:12,rotazione:!0,tipoAcqua:"rubinetto",metodo:"Acqua nel sottovaso, mai sulle foglie.",consiglio:"Luce brillante o perde le macchie rosa e si allunga."},"Sedum nussbaumerianum":{giorni:18,concime:60,miscela:"grasse",rinvaso:36,rotazione:!0,tipoAcqua:"rubinetto",metodo:"Abbondante ma rarissima, mai sulle rosette: l'acqua nel colletto le fa marcire.",consiglio:"Pi\xF9 sole prende, pi\xF9 le foglie virano al rame. In ombra restano verdi e si allungano."},Philodendron:{giorni:8,concime:21,miscela:"aroidee-terrestri",rinvaso:18,sostegno:"palo-cocco",spray:!0,pulizia:!0,rotazione:!0,tipoAcqua:"rubinetto",metodo:"A pioggia fino al drenaggio, poi svuota il sottovaso.",consiglio:"Luce indiretta, tollera la penombra."},Altro:{giorni:7,concime:28,miscela:"facili",rinvaso:18,rotazione:!0,tipoAcqua:"rubinetto",metodo:"",consiglio:""}},gn=[{ill:"deliciosa",t:"La colonna d'acqua",te:"The water column",d:"Ogni pianta ha una riserva che si svuota giorno dopo giorno. Piena vuol dire appena annaffiata, vuota vuol dire che tocca a lei. La striscia in cima \xE8 tutta la casa a colpo d'occhio.",de:"Each plant has a reservoir that empties day by day. Full means just watered, empty means it's due. The strip at the top shows the whole house at a glance."},{ill:"maranta",t:"Conta le foglie",te:"Count the leaves",d:"Ogni volta che vedi spuntare una foglia nuova, premi \u201C+ foglia nuova\u201D. Dopo qualche mese l'app conosce il ritmo di ognuna, prevede la prossima e ti avvisa quando rallenta: \xE8 il modo pi\xF9 precoce per accorgersi che qualcosa non va.",de:"Whenever you spot a new leaf, tap \u201C+ new leaf\u201D. After a few months the app knows each plant's rhythm, predicts the next leaf and warns you when it slows: the earliest way to notice something is wrong."},{ill:"anthurium-regale",t:"Non solo acqua",te:"Not just water",d:"Concime, tonico, pulizia delle foglie, rinvaso e un quarto di giro a settimana hanno ritmi diversi, e si sospendono da soli quando non vanno dati. Nelle guide trovi il terriccio giusto, l'acqua giusta e la diagnosi dei problemi.",de:"Feeding, foliar tonic, leaf cleaning, repotting and a weekly quarter turn all run on their own rhythms, and pause themselves when they shouldn't be done. The guides cover the right soil mix, the right water and a symptom-based diagnosis."},{ill:"snake",t:"Si scorre",te:"Swipe it",d:"Trascina una scheda a destra per annaffiare, a sinistra per aprirla. Ogni azione si pu\xF2 annullare, e in \u201CLascia stare\u201D trovi cosa oggi \xE8 meglio non toccare.",de:"Swipe a card right to water, left to open it. Every action can be undone, and \u201CLeave alone\u201D shows what's best not touched today."}],cf="cura-piante:v2",uf="cura-piante:io",pf=`
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

.cp *, .cp *::before, .cp *::after { box-sizing: border-box; }
.cp {
  --foglia:#16241F; --carta:#E4EAE1; --scheda:#F4F7F2; --pieno:#FFFFFF; --acqua:#2E6F8E;
  --acqua-chiara:#8FBECF; --secco:#B0762A; --tenue:#6C7A70; --linea:#C9D3C6;
  --errore-fondo:#FBEDE0; --errore-testo:#7A4E14; --lumi:1;
  color-scheme:light;
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  overflow-x:hidden; max-width:100vw;
  background:var(--carta); color:var(--foglia); min-height:100%;
  padding:28px 18px 60px; line-height:1.5;
}

/* --- tema scuro --- */
.cp.scuro {
  --foglia:#E7EEE6; --carta:#0E1915; --scheda:#16241E; --pieno:#1C2E27; --acqua:#74AEC9;
  --acqua-chiara:#3F7189; --secco:#D2A05B; --tenue:#93A79A; --linea:#2B3E35;
  --errore-fondo:#33261A; --errore-testo:#E0B47E; --lumi:1.42;
  color-scheme:dark;
}
.cp.scuro .cp-previsione { margin:0 0 16px; padding:9px 12px; border-radius:9px; background:rgba(76,122,99,.12);
  font-size:12.5px; line-height:1.45; color:#3D6551; }
.cp-previsione.ora { background:rgba(176,118,42,.12); color:var(--secco); }
.cp.scuro .cp-previsione { background:rgba(120,175,145,.14); color:#9CC7AC; }
.cp-metodo { background:rgba(116,174,201,.13); }
.cp.scuro .cp-parte { background:rgba(116,174,201,.15); }
.cp.scuro .cp-distintivo.preso { background:rgba(116,174,201,.12); }
.cp.scuro .cp-distintivo.dipianta.preso { background:rgba(120,175,145,.14); }
.cp.scuro .cp-distintivo.eraSegreto.preso { background:rgba(210,160,91,.13); }
.cp.scuro .cp-annullo { box-shadow:0 6px 22px rgba(0,0,0,.5); }
.cp.scuro .cp-velo-pieno { align-items:stretch !important; padding:0 !important; }
.cp-velo-pieno { animation:velo .25s ease both; }
@keyframes velo { from { opacity:0 } to { opacity:1 } }
@keyframes sale { from { opacity:0; transform:translateY(22px) scale(.97) } to { opacity:1; transform:none } }
.cp-foglio-ill svg { animation:ingrandisce .45s cubic-bezier(.3,1.2,.4,1) both; }
@keyframes ingrandisce { from { opacity:0; transform:scale(.55) } to { opacity:1; transform:none } }
.cp-foglio { animation:sale .34s cubic-bezier(.2,.9,.3,1) both; background:var(--carta);
  overscroll-behavior:contain; -webkit-overflow-scrolling:touch; max-height:100dvh; width:100%; max-width:640px; margin:0 auto; padding:22px 18px calc(28px + env(safe-area-inset-bottom));
  overflow-y:auto; padding-top:calc(22px + env(safe-area-inset-top)); }
.cp-intro { text-align:center; }
.cp-intro-ill { width:110px; height:110px; margin:0 auto 14px; }
.cp-intro-testo { font-size:14px; line-height:1.6; color:var(--tenue); margin:0 0 18px; }
.cp-pallini { display:flex; gap:7px; justify-content:center; margin-bottom:4px; }
.cp-pallini i { width:7px; height:7px; border-radius:50%; background:var(--linea); }
.cp-pallini i.attivo { background:var(--acqua); }
.cp-intro .cp-modale-azioni { justify-content:space-between; align-items:center; }
.cp-foglio-testa { display:flex; gap:14px; align-items:flex-start; margin-bottom:20px; }
.cp-foglio-ill { flex:0 0 76px; height:76px; }
.cp-chiudi { margin-left:auto; border:0; background:none; font-size:26px; line-height:1; color:var(--tenue); cursor:pointer; padding:0 4px; }
.cp-periodo { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:20px; font-size:13px; color:var(--tenue); }
.cp-periodo input { margin-left:6px; padding:6px 9px; border:1px solid var(--linea); border-radius:8px; font:inherit; font-size:13px;
  background:var(--pieno); color:var(--foglia); }
.cp-lib-titolo { font-family:'Fraunces',ui-serif,Georgia,serif; font-size:26px; font-weight:600; margin:0 0 4px; }
.cp-lib-sotto { font-size:12.5px; color:var(--tenue); margin:0 0 22px; }
.cp-lib-sez { margin-bottom:22px; }
.cp-lib-sez h2 { font-family:'Fraunces',ui-serif,Georgia,serif; font-size:17px; font-weight:600; margin:0 0 8px;
  padding-bottom:5px; border-bottom:1px solid var(--linea); }
.cp-lib-sez ul { margin:0; padding-left:19px; font-size:13px; line-height:1.6; color:var(--tenue); }
.cp-lib-sez p { font-size:13px; line-height:1.6; color:var(--tenue); margin:0 0 8px; }
.cp-lib-sez b { color:var(--foglia); }
.cp-lib-giorno { margin-bottom:12px; }
.cp-lib-giorno h3 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--foglia); margin:0 0 4px; font-weight:600; }
.cp-lib-giorno li.acqua b { color:var(--acqua); }
.cp-lib-stanza { margin-bottom:12px; }

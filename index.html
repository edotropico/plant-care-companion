  <style>
    /* Solo l'essenziale per la prima pittura: il resto sta in css/style.css */
    html, body { margin:0; padding:0; background:#EAE7DC; -webkit-text-size-adjust:100%; overflow-x:clip; }
    @media (prefers-color-scheme: dark) { html, body { background:#14140F; } }
    body { min-height:100dvh; }
    #radice { padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    input, select, textarea, button { font-size:16px; }
    #scatto-tattile { position:fixed; left:-9999px; width:1px; height:1px; opacity:0; }
    #avvio { position:fixed; inset:0; z-index:999; background:#16241F; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:24px; transition:opacity .45s ease;
      font-family:ui-sans-serif, system-ui, sans-serif; }
    #avvio.via { opacity:0; pointer-events:none; }
    #avvio svg { width:104px; height:104px; animation:cresce .8s cubic-bezier(.34,1.3,.5,1) both; }
    @keyframes cresce { from { opacity:0; transform:scale(.82) } to { opacity:1; transform:scale(1) } }
    #avvio p { margin:0; color:#8C9E92; font-size:11px; letter-spacing:.22em; text-transform:uppercase;
      animation:appare .6s .35s both; }
    @keyframes appare { from { opacity:0 } to { opacity:1 } }
    @media (prefers-reduced-motion: reduce) { #avvio svg, #avvio p { animation:none } }
    @media print { #avvio { display:none !important; } }
  </style>
